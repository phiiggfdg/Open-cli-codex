<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Open CLI Codex — Web</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   1. RESET & VARIABLES
   ═══════════════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --bg: #f5f3ee;
  --bg-card: #ffffff;
  --bg-input: #f0ede6;
  --bg-sunken: #eae7de;
  --border: #e0dbd0;
  --border-light: #ebe7dc;
  --text: #2d2a24;
  --text-dim: #8a8478;
  --accent: #6b8f5b;
  --accent-light: rgba(107,143,91,0.1);
  --accent-gold: #b08a4e;
  --warn: #c49030;
  --warn-bg: #fdf6e8;
  --err: #c45040;
  --err-bg: #fdf0ee;
  --user-bg: #4a6842;
  --r: 16px;
  --r-sm: 10px;
  --r-xs: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: "Inter", -apple-system, "Segoe UI", sans-serif; color: var(--text); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   2. LAYOUT
   ═══════════════════════════════════════════════════════════════════════ */
#wrap { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
#mainSplit { flex: 1 1 auto; display: flex; flex-direction: row; min-height: 30vh; overflow: hidden; }
#logScroll {
  flex: 0 1 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  position: relative; transition: flex-basis .3s ease;
}
#log {
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
  min-width: 0; min-height: 100%; font-size: 15px; line-height: 1.6;
}

/* Nút "cuộn xuống tin mới" — hiện khi người dùng đang xem lại (đã kéo lên) */
#jumpToBottomBtn {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(8px);
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
  border-radius: 999px; padding: 7px 14px 7px 12px; font-size: 12.5px; font-weight: 600;
  box-shadow: var(--shadow-lg); cursor: pointer; z-index: 5;
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
}
#jumpToBottomBtn.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
#jumpToBottomBtn:active { transform: translateX(-50%) translateY(0) scale(0.96); }
#jumpToBottomBtn svg { flex: 0 0 auto; }

/* ═══════════════════════════════════════════════════════════════════════
   3. HEADER BAR
   ═══════════════════════════════════════════════════════════════════════ */
#bar {
  flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; font-size: 12px; font-weight: 500; color: var(--text-dim);
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}
#status { display: flex; align-items: center; gap: 8px; }
#statusText { color: var(--text); font-weight: 600; }
#dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--err);
  transition: background .3s;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
#dot.ok { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
#meta {
  color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums;
  flex: 1; min-width: 0; margin-left: 12px; text-align: right;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ═══════════════════════════════════════════════════════════════════════
   4. CHAT BUBBLES
   ═══════════════════════════════════════════════════════════════════════ */
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes bubbleUser { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:translateX(0)} }
@keyframes bubbleAi { from{opacity:0;transform:translateX(-16px)} to{opacity:1;transform:translateX(0)} }

.row { white-space: pre-wrap; word-break: break-word; animation: fadeIn .25s ease both; }
.dim { color: var(--text-dim); }
.mono { font-family: "JetBrains Mono", monospace; font-size: 12.5px; }

.bubble-wrap { display: flex; width: 100%; }
.bubble-wrap.from-user { justify-content: flex-end; }
.bubble-wrap.from-ai { justify-content: flex-start; }
.bubble-wrap.from-user .bubble { animation: bubbleUser .3s ease both; }
.bubble-wrap.from-ai .bubble { animation: bubbleAi .3s ease both; }

.bubble {
  max-width: 88%; border-radius: var(--r); padding: 12px 16px;
  white-space: pre-wrap; word-break: break-word;
  transition: transform .1s;
}
.bubble:active { transform: scale(0.98); }
.bubble.user {
  background: var(--user-bg); color: #f8f7f2;
  border-bottom-right-radius: 4px;
  box-shadow: 0 2px 8px rgba(74,104,66,0.25);
}
.bubble.ai {
  background: var(--bg-card); color: var(--text);
  border: 1px solid var(--border-light); border-bottom-left-radius: 4px;
  box-shadow: var(--shadow);
}

/* Streaming cursor */
@keyframes blink { 0%,45%{opacity:1} 50%,95%{opacity:0} }
.ai-body.streaming::after {
  content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px;
  background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite;
}
@keyframes streamFadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
.ai-body.streaming { animation: streamFadeIn .18s ease-out; }

/* Links in bubbles */
a.cw-chat-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
a.cw-chat-link:active { opacity: .7; }
.bubble.user a.cw-chat-link { color: #e8e6dc; text-decoration-color: rgba(255,255,255,.5); }

/* Image thumbnails in bubbles */
.bubble-img-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.bubble-img-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--border); }

/* ═══════════════════════════════════════════════════════════════════════
   MARKDOWN RENDERING (bubble AI)
   ═══════════════════════════════════════════════════════════════════════ */
.bubble.ai { white-space: normal; }
.bubble.ai .md-p { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; }
.bubble.ai .md-p:last-child { margin-bottom: 0; }
.bubble.ai .md-h { margin: 14px 0 8px; line-height: 1.3; font-weight: 700; }
.bubble.ai .md-h:first-child { margin-top: 0; }
.bubble.ai h1.md-h { font-size: 1.25em; }
.bubble.ai h2.md-h { font-size: 1.15em; }
.bubble.ai h3.md-h { font-size: 1.06em; }
.bubble.ai h4.md-h, .bubble.ai h5.md-h, .bubble.ai h6.md-h { font-size: 1em; color: var(--text-dim); }
.bubble.ai .md-list { margin: 0 0 8px; padding-left: 22px; }
.bubble.ai .md-list:last-child { margin-bottom: 0; }
.bubble.ai .md-list li { margin: 3px 0; white-space: pre-wrap; word-break: break-word; }
.bubble.ai .md-quote {
  margin: 0 0 8px; padding: 6px 12px; border-left: 3px solid var(--accent);
  background: var(--accent-light); color: var(--text-dim); border-radius: 0 var(--r-xs) var(--r-xs) 0;
  white-space: pre-wrap;
}
.bubble.ai .md-hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.bubble.ai code.inline-code {
  font-family: "JetBrains Mono", monospace; font-size: 0.88em;
  background: var(--bg-sunken); border: 1px solid var(--border-light);
  padding: 1px 6px; border-radius: 5px; white-space: pre-wrap; word-break: break-word;
}
.bubble.ai .code-block {
  margin: 4px 0 10px; border-radius: var(--r-sm); overflow: hidden;
  border: 1px solid var(--border); background: #232016;
}
.bubble.ai .code-block:last-child { margin-bottom: 0; }
.bubble.ai .code-block-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; background: #2c2818; border-bottom: 1px solid rgba(255,255,255,0.08);
  user-select: none; -webkit-user-select: none;
}
.bubble.ai .code-lang {
  font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .02em;
  color: #b9b19a; text-transform: lowercase;
}
.bubble.ai .code-copy-btn {
  font-family: "Inter", sans-serif; font-size: 11px; font-weight: 600;
  color: #d8d2c2; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--r-xs); padding: 3px 9px; cursor: pointer; transition: background .15s;
}
.bubble.ai .code-copy-btn:active { background: rgba(255,255,255,0.18); }
.bubble.ai .code-copy-btn.copied { color: #d7e8c9; border-color: rgba(139,182,110,0.4); }
.bubble.ai .code-block pre {
  margin: 0; padding: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.bubble.ai .code-block code {
  font-family: "JetBrains Mono", monospace; font-size: 12.5px; line-height: 1.55;
  color: #eae5d6; white-space: pre;
}
.bubble.ai strong { font-weight: 700; }
.bubble.ai em { font-style: italic; }
.bubble.ai del { opacity: .6; text-decoration: line-through; }

/* Task list (checkbox) */
.bubble.ai .task-list { list-style: none; padding-left: 4px; }
.bubble.ai .task-item { display: flex; align-items: flex-start; gap: 8px; list-style: none; }
.bubble.ai .task-box {
  flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px; border-radius: 4px;
  border: 1.5px solid var(--border); display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; line-height: 1; color: #fff; background: var(--bg-sunken);
}
.bubble.ai .task-box.checked { background: var(--accent); border-color: var(--accent); }
.bubble.ai .task-done { text-decoration: line-through; color: var(--text-dim); }

/* Nested lists */
.bubble.ai .md-list .md-list { margin: 4px 0 0; }

/* Bảng markdown */
.bubble.ai .md-table-wrap {
  margin: 4px 0 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border); border-radius: var(--r-sm);
}
.bubble.ai .md-table-wrap:last-child { margin-bottom: 0; }
.bubble.ai table.md-table {
  border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: max-content;
}
.bubble.ai table.md-table th, .bubble.ai table.md-table td {
  padding: 7px 12px; border-bottom: 1px solid var(--border-light); text-align: left;
  white-space: normal; word-break: break-word;
}
.bubble.ai table.md-table th {
  background: var(--bg-sunken); font-weight: 700; color: var(--text);
  border-bottom: 1px solid var(--border);
}
.bubble.ai table.md-table tr:last-child td { border-bottom: none; }
.bubble.ai table.md-table tbody tr:nth-child(even) { background: rgba(0,0,0,0.015); }


/* ═══════════════════════════════════════════════════════════════════════
   5. TOOL GROUPS & INFO CARDS
   ═══════════════════════════════════════════════════════════════════════ */
.tool-group {
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--r-sm); padding: 10px 12px 10px 0;
  border-left: 3px solid var(--accent); box-shadow: var(--shadow);
  animation: fadeIn .25s ease both; min-width: 0;
}
.tool-group.denied { border-left-color: var(--err); background: var(--err-bg); }
.tool-group-head {
  display: flex; align-items: baseline; gap: 8px; padding: 0 12px 6px 14px;
  font-weight: 600; min-width: 0;
}
.tool-group-head .tool-icon { font-size: 13px; opacity: .7; flex-shrink: 0; }
.tool-group-head .tool-name { color: var(--text); flex-shrink: 0; }
.tool-group-head .tool-brief {
  color: var(--text-dim); font-weight: 400; font-size: 12.5px;
  white-space: pre-wrap; word-break: break-word; min-width: 0; flex: 1;
}
.tool-arg-chip {
  background: var(--bg-sunken); border-radius: var(--r-xs); padding: 1px 6px;
  display: inline-block; max-width: 100%; white-space: pre-wrap; word-break: break-word;
}
.tool-children { position: relative; margin-left: 14px; padding-left: 16px; min-width: 0; }
.tool-children::before {
  content: ""; position: absolute; left: 0; top: 2px; bottom: 8px;
  width: 2px; background: var(--border); border-radius: 2px;
}
.tool-child {
  position: relative; padding: 4px 10px 4px 8px; color: var(--text-dim);
  font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
}
.tool-child::before {
  content: ""; position: absolute; left: -16px; top: 12px; width: 12px; height: 2px;
  background: var(--border);
}
.tool-child.child-info { color: var(--text); background: var(--bg-sunken); border-radius: var(--r-xs); margin: 2px 8px 2px 0; padding: 8px; }
.tool-child.child-warn { color: var(--warn); }
.tool-child.child-err { color: var(--err); }
.tool-child.child-denied { color: var(--err); font-weight: 500; }

/* Info cards */
.info-card {
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--r-sm); padding: 10px 14px; box-shadow: var(--shadow);
  animation: fadeIn .25s ease both;
}
.info-card.raw-info { font-family: "JetBrains Mono", monospace; font-size: 12.5px; background: var(--bg-sunken); }
.info-card.warn { border-color: #e8c880; background: var(--warn-bg); color: #7d5a24; }
.info-card.err { border-color: #e0a8a0; background: var(--err-bg); color: #833a2a; }
.info-card.step { background: transparent; border: none; box-shadow: none; padding: 2px 12px; color: var(--text-dim); font-family: "JetBrains Mono", monospace; font-size: 12px; }
.info-card.think {
  background: var(--bg-sunken); border-left: 3px solid var(--accent-gold);
  color: var(--text-dim); font-style: italic;
  padding: 10px 14px 8px;
}
.info-card.think .think-label {
  display: flex; align-items: center; gap: 6px;
  font-style: normal; font-weight: 600; color: var(--accent-gold);
  font-family: "JetBrains Mono", monospace; font-size: 12px; margin-bottom: 4px;
}
.think-viewport {
  position: relative; max-height: 4.8em; overflow: hidden;
  transition: max-height .25s ease; scroll-behavior: smooth;
}
.think-viewport::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1.6em;
  background: linear-gradient(to bottom, var(--bg-sunken) 15%, transparent 100%);
  pointer-events: none; z-index: 1; opacity: 0; transition: opacity .2s ease;
}
.info-card.think.has-overflow .think-viewport::before { opacity: 1; }
.info-card.think.expanded .think-viewport { max-height: none; }
.info-card.think.expanded .think-viewport::before { opacity: 0; }
.think-body { white-space: pre-wrap; line-height: 1.6; }
.think-toggle {
  display: none; margin-top: 6px; background: none; border: none; padding: 0;
  font-family: "Inter", sans-serif; font-style: normal; font-size: 11px; font-weight: 600;
  color: var(--accent-gold); cursor: pointer; opacity: .85;
}
.info-card.think.has-overflow .think-toggle { display: inline-block; }
.think-toggle:active { opacity: .6; }

/* ═══════════════════════════════════════════════════════════════════════
   6. ASK BOXES & MODEL PICKER
   ═══════════════════════════════════════════════════════════════════════ */
.ask-box {
  border: 1px solid #e8c880; background: var(--warn-bg);
  border-radius: var(--r); padding: 14px; animation: fadeIn .25s ease both;
  box-shadow: var(--shadow-lg);
  transition: opacity .3s, transform .3s;
}
.ask-prompt { color: #7d5a24; margin-bottom: 10px; white-space: pre-wrap; font-weight: 500; }
.ask-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ask-btn {
  background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 10px 18px; font-size: 14px; font-weight: 600;
  cursor: pointer; min-height: 44px; box-shadow: var(--shadow);
  transition: transform .1s;
}
.ask-btn:active { transform: scale(0.96); }
.ask-btn.yes { background: var(--accent); border-color: var(--accent); color: #fff; }
.ask-btn.no { background: var(--err); border-color: var(--err); color: #fff; }
.ask-input { display: flex; gap: 8px; margin-top: 10px; }
.ask-input input {
  flex: 1; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text); padding: 10px 12px;
  font-size: 15px; font-family: inherit; min-height: 44px;
}
.ask-input button {
  background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm);
  padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px;
}
.ask-input button:active { transform: scale(0.96); }
.ask-answered .ask-input, .ask-answered .ask-actions { display: none; }
.ask-answered { opacity: .35; pointer-events: none; }
.ask-answer-tag {
  display: flex; align-items: center; gap: 6px; margin: 6px 8px 0;
  font-weight: 600; color: var(--accent); font-size: 13px; animation: fadeIn .25s ease both;
}
.ask-answer-tag::before { content: "✓"; }
@keyframes askBoxOut { from{opacity:1;max-height:400px} to{opacity:0;max-height:0;margin-bottom:-8px} }
.ask-box-leaving { animation: askBoxOut .3s ease both; overflow: hidden; pointer-events: none; }

/* Model picker */
@keyframes itemIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.model-picker { margin-top: 6px; }
.model-picker-search input {
  width: 100%; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text); padding: 10px 12px;
  font-size: 15px; font-family: inherit; margin-bottom: 8px; min-height: 44px;
}
.model-picker-list { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; }
.model-picker-empty { color: var(--text-dim); font-size: 13px; padding: 10px; text-align: center; }
.model-picker-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 10px 12px; font-size: 13.5px; font-family: "JetBrains Mono", monospace;
  cursor: pointer; min-height: 44px;
  animation: itemIn .2s ease both; animation-delay: calc(var(--i,0)*25ms);
}
.model-picker-item:active { background: var(--bg-sunken); transform: scale(0.98); }
.model-picker-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-picker-badge { flex: 0 0 auto; }
.model-picker-pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.model-picker-page-btn {
  background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm);
  padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 40px;
}
.model-picker-page-btn:disabled { opacity: .3; cursor: default; }
.model-picker-page-info { color: var(--text-dim); font-size: 12px; text-align: center; flex: 1; }
@keyframes pageNext { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:translateX(0)} }
@keyframes pagePrev { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
.model-picker-list.picker-page-next { animation: pageNext .2s ease both; }
.model-picker-list.picker-page-prev { animation: pagePrev .2s ease both; }

/* ═══════════════════════════════════════════════════════════════════════
   7. INPUT BAR & IMAGE PREVIEW
   ═══════════════════════════════════════════════════════════════════════ */
#inputBar {
  flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg-card); border-top: 1px solid var(--border);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  position: relative;
}
#inputField {
  flex: 1; min-width: 0; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 22px; outline: none;
  color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.4;
  padding: 12px 18px; min-height: 48px; max-height: min(9.8em, 32vh);
  resize: none; overflow-y: auto; -webkit-overflow-scrolling: touch;
  transition: border-color .15s, box-shadow .15s;
}
#inputField:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
#inputField:disabled { background: var(--bg-sunken); color: var(--text-dim); cursor: not-allowed; }

/* Round action buttons */
#sendBtn, #ctrlBtn, #imgBtn {
  flex: 0 0 auto; width: 48px; height: 48px; border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer; padding: 0;
  transition: transform .1s, opacity .15s;
}
#sendBtn:active, #ctrlBtn:active, #imgBtn:active { transform: scale(0.9); }
#sendBtn {
  background: var(--accent); color: #fff;
  box-shadow: 0 3px 10px rgba(107,143,91,0.3);
}
#sendBtn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; box-shadow: none; }
#ctrlBtn {
  background: var(--bg-input); color: var(--err);
  border: 1.5px solid rgba(196,80,64,0.3);
  font-size: 12px; font-weight: 700;
}
#imgBtn {
  background: var(--bg-input); color: var(--accent);
  border: 1.5px solid var(--border);
}
#imgBtn:disabled { opacity: .3; cursor: not-allowed; }
#imgBtn.has-images { background: var(--accent); color: #fff; border-color: var(--accent); }
#imgInput { display: none; }

/* Image preview bar */
#imgPreviewBar {
  display: none; flex: 0 0 auto; gap: 8px; padding: 8px 12px 0;
  background: var(--bg-card);
}
#imgPreviewBar.show { display: flex; flex-wrap: wrap; }
.img-thumb {
  position: relative; width: 52px; height: 52px; border-radius: var(--r-sm);
  overflow: hidden; border: 1px solid var(--border);
}
.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-thumb .rm {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,.6); color: #fff; border: none; font-size: 12px; line-height: 20px;
  cursor: pointer; text-align: center;
}

/* ═══════════════════════════════════════════════════════════════════════
   8. SLASH HINTS
   ═══════════════════════════════════════════════════════════════════════ */
#slashHint {
  position: absolute; left: 8px; right: 8px; bottom: 100%;
  max-height: 45vh; overflow-y: auto; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--r);
  margin-bottom: 8px; display: none; box-shadow: var(--shadow-lg);
}
#slashHint.show { display: block; }
.slash-item {
  display: flex; gap: 10px; align-items: baseline; padding: 12px 14px;
  font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border-light);
  min-height: 44px;
}
.slash-item:last-child { border-bottom: none; }
.slash-item:active, .slash-item.active { background: var(--bg-sunken); }
.slash-item .cmd { color: var(--accent); font-weight: 700; font-family: "JetBrains Mono", monospace; }
.slash-item .desc { color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ═══════════════════════════════════════════════════════════════════════
   9. TURN TOGGLE
   ═══════════════════════════════════════════════════════════════════════ */
.turn-logs {
  display: grid; grid-template-rows: 0fr; opacity: 0; margin-top: 0;
  transition: grid-template-rows .3s ease, opacity .25s ease, margin-top .3s ease;
}
.turn-logs > .turn-logs-inner {
  overflow: hidden; display: flex; flex-direction: column; gap: 8px;
  min-height: 0; min-width: 0;
}
.turn-logs.open { grid-template-rows: 1fr; opacity: 1; margin-top: 4px; }
.turn-logs-inner {
  padding: 10px; border-radius: var(--r);
  background: var(--bg-sunken); border: 1px solid var(--border-light);
}
.turn-toggle-row { display: flex; justify-content: flex-start; margin: 0 4px; }
.turn-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 14px 6px 10px;
  font-size: 12px; font-weight: 600; color: var(--text-dim);
  cursor: pointer; min-height: 36px; box-shadow: var(--shadow);
  transition: background .15s, color .1s;
}
.turn-toggle:active { transform: scale(0.97); }
.turn-toggle:hover, .turn-toggle.open { background: var(--bg-sunken); color: var(--text); }
.turn-toggle .chev { font-size: 10px; transition: transform .2s; display: inline-block; }
.turn-toggle.open .chev { transform: rotate(90deg); }
.turn-toggle .tool-count {
  background: var(--bg-sunken); color: var(--text); border-radius: 10px;
  padding: 1px 7px; font-size: 11px; font-weight: 700;
}
.turn-toggle.open .tool-count { background: var(--accent-light); }

/* ═══════════════════════════════════════════════════════════════════════
   10. SPINNER
   ═══════════════════════════════════════════════════════════════════════ */
.spinner-row { display: flex; align-items: center; gap: 0; font-family: "JetBrains Mono", monospace; }
.spinner-frame { color: var(--accent); display: inline-block; width: 1ch; text-align: center; }
.spinner-label { color: var(--accent); margin-left: 6px; font-family: "Inter", sans-serif; font-weight: 600; }
.spinner-rain { color: var(--text-dim); margin-left: 8px; letter-spacing: 1px; }
.spinner-time { color: var(--text-dim); margin-left: 8px; }

/* ═══════════════════════════════════════════════════════════════════════
   11. LIVE SLOT (floating tool preview)
   ═══════════════════════════════════════════════════════════════════════ */
.live-slot {
  position: fixed; left: 10px; top: calc(var(--bar-h, 44px) + 10px); z-index: 40;
  width: min(88vw, 360px); opacity: 0; transform: translateX(-16px) scale(.95);
  transition: transform .3s ease, opacity .25s ease; pointer-events: none;
}
.live-slot > div {
  overflow: hidden; border-radius: var(--r-sm); box-shadow: var(--shadow-lg);
}
.live-slot > div > * { margin: 0 !important; width: 100%; max-width: 100%; animation: none !important; }
.live-slot.entering { opacity: 1; transform: translateX(0) scale(1); }
.live-slot.collapsing { opacity: 0; transform: translateX(-16px) scale(.95); }

/* ═══════════════════════════════════════════════════════════════════════
   12. CODEWEB (2-column layout, preview panel)
   ═══════════════════════════════════════════════════════════════════════ */
#codewebPane {
  display: flex; flex: 0 0 0%; overflow: hidden; flex-direction: column;
  background: #1e1e1e; position: relative; transition: flex-basis .3s ease;
}
#codewebPane > * { opacity: 0; transition: opacity .18s ease; }
#mainSplit.codeweb-on #codewebPane > * { opacity: 1; transition-delay: .12s; }
#mainSplit.codeweb-on #logScroll { flex: 0 1 48%; border-right: 1px solid var(--border); }
#mainSplit.codeweb-on #codewebPane { flex: 0 0 52%; }

/* Codeweb resizer */
#codewebResizer {
  flex: 0 0 0; width: 0; overflow: hidden; position: relative;
  cursor: col-resize; touch-action: none; transition: width .3s ease, height .3s ease;
}
#mainSplit.codeweb-on #codewebResizer { flex: 0 0 10px; width: 10px; }
#mainSplit.codeweb-on #logScroll { border-right: 0; }
#codewebResizer::before {
  content: ""; position: absolute; inset: 0; left: 4px; width: 1px;
  background: var(--border); transition: background .1s;
}
#codewebResizer:hover::before, #codewebResizer.cw-dragging::before { background: var(--accent); }
#codewebResizerGrip {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 4px; height: 28px; border-radius: 3px; background: var(--border);
  transition: background .1s, height .1s;
}
#codewebResizer:hover #codewebResizerGrip,
#codewebResizer.cw-dragging #codewebResizerGrip { background: var(--accent); height: 40px; }
#mainSplit.cw-resizing #logScroll, #mainSplit.cw-resizing #codewebPane { transition: none; }
#mainSplit.cw-resizing { cursor: col-resize; user-select: none; }
#mainSplit.cw-resizing #codewebFrame { pointer-events: none; }

/* Codeweb toolbar & tabs */
#codewebToolbar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  gap: 6px; padding: 6px 8px; background: var(--bg-sunken); border-bottom: 1px solid var(--border);
}
#codewebTabs {
  flex: 1; display: flex; gap: 4px; overflow-x: auto; min-width: 0;
  mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
}
#codewebTabs .cw-tab {
  font-size: 12px; padding: 5px 10px; border-radius: 20px; white-space: nowrap;
  max-width: 140px; overflow: hidden; text-overflow: ellipsis;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; transition: all .15s;
}
#codewebTabs .cw-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
#codewebToolbarBtns { flex: 0 0 auto; display: flex; gap: 4px; }
#codewebToolbarBtns button {
  width: 28px; height: 28px; border-radius: var(--r-xs); border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-dim); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
#codewebToolbarBtns button:active { background: var(--accent); color: #fff; border-color: var(--accent); }
#codewebReloadBtn.cw-spinning { animation: spin .7s linear infinite; }
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

/* Codeweb settings panel */
#codewebSettingsPanel {
  display: none; position: absolute; top: 40px; right: 8px; z-index: 20;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 10px 12px; box-shadow: var(--shadow-lg); min-width: 180px;
}
#codewebSettingsPanel.show { display: block; }
.cw-settings-title { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px; }
#codewebRatioOptions { display: flex; flex-wrap: wrap; gap: 6px; }
#codewebRatioOptions button {
  font-size: 12px; padding: 5px 9px; border-radius: var(--r-xs);
  border: 1px solid var(--border); background: var(--bg-input); color: var(--text-dim); cursor: pointer;
}
#codewebRatioOptions button:active { transform: scale(.95); }
#codewebRatioOptions button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Codeweb frame */
#codewebFrameWrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: auto; background: #1e1e1e; min-height: 0; position: relative;
}
#codewebFrameWrap.cw-has-ratio #codewebFrame { box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
#codewebFrame {
  flex: 1; width: 100%; height: 100%; border: 0; background: #fff;
  opacity: 0; transform: scale(.98); transition: opacity .2s, transform .2s; pointer-events: none;
}
#codewebFrameWrap.cw-has-ratio #codewebFrame { flex: none; }
@keyframes cwSlideIn { from{transform:translateX(24px);opacity:0} to{transform:translateX(0);opacity:1} }
#codewebFrame.cw-slide-in { animation: cwSlideIn .2s ease-out; }
#codewebPane.has-preview #codewebFrame { opacity: 1; transform: scale(1); pointer-events: auto; }
#codewebPane.has-preview #codewebEmpty { opacity: 0; pointer-events: none; }
#codewebEmpty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: #8a8a8a; font-size: 13px; text-align: center; padding: 24px;
  position: absolute; inset: 0; opacity: 1; transition: opacity .2s;
}

/* Codeweb flat chat mode */
#mainSplit.codeweb-on #log { padding: 14px clamp(12px, 3.5vw, 28px) 24px; gap: 0; font-size: 14px; line-height: 1.58; }
#mainSplit.codeweb-on .bubble-wrap.from-ai { margin: 12px 0 2px; }
#mainSplit.codeweb-on .bubble-wrap.from-user { justify-content: flex-end; margin: 10px 0 16px; }
#mainSplit.codeweb-on .bubble.ai {
  width: 100%; max-width: 100%; padding: 5px 0;
  background: transparent; border: 0; border-radius: 0; box-shadow: none; font-size: 14.5px;
}
#mainSplit.codeweb-on .bubble.user { max-width: 88%; padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 13.5px; }
#mainSplit.codeweb-on .turn-toggle-row { margin: 1px 0 10px; }
#mainSplit.codeweb-on .turn-toggle { gap: 5px; padding: 5px; border: 0; background: transparent; box-shadow: none; font-size: 12px; }
#mainSplit.codeweb-on .turn-toggle:hover, #mainSplit.codeweb-on .turn-toggle.open { background: var(--accent-light); }
#mainSplit.codeweb-on .turn-toggle .tool-count { order: 1; padding: 0; background: transparent; }
#mainSplit.codeweb-on .turn-toggle .label { order: 2; font-weight: 500; }
#mainSplit.codeweb-on .turn-toggle .chev { order: 3; }
#mainSplit.codeweb-on .turn-logs-inner { padding: 7px; border-radius: var(--r-sm); gap: 6px; background: rgba(255,254,251,.5); }
#mainSplit.codeweb-on .tool-group { margin: 0; padding: 8px 9px 8px 0; box-shadow: none; }
#mainSplit.codeweb-on .tool-children { display: block; margin-left: 10px; padding-left: 12px; }
#mainSplit.codeweb-on .bubble-img-thumb { width: 56px; height: 56px; }

/* Codeweb composer */
body.codeweb-mode #inputBar {
  display: grid; grid-template-columns: 44px 44px minmax(0,1fr) 44px;
  grid-template-rows: auto 44px; gap: 7px 8px;
  margin: 8px 10px 9px; padding: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 24px; box-shadow: var(--shadow-lg);
}
body.codeweb-mode #inputField { grid-column: 1/-1; grid-row: 1; min-height: 42px; max-height: min(8em, 26vh); padding: 7px 9px; border: 0; border-radius: 12px; background: transparent; box-shadow: none; }
body.codeweb-mode #inputField:focus { border: 0; box-shadow: none; }
body.codeweb-mode #ctrlBtn { grid-column: 1; grid-row: 2; }
body.codeweb-mode #imgBtn { grid-column: 2; grid-row: 2; }
body.codeweb-mode #sendBtn { grid-column: 4; grid-row: 2; }
body.codeweb-mode #ctrlBtn, body.codeweb-mode #imgBtn, body.codeweb-mode #sendBtn { width: 44px; height: 44px; }
body.codeweb-mode #imgPreviewBar {
  margin: 0 10px; padding: 7px 10px; border: 1px solid var(--border);
  border-bottom: 0; border-radius: 14px 14px 0 0; background: var(--bg-card);
}

/* ═══════════════════════════════════════════════════════════════════════
   13. MODALS
   ═══════════════════════════════════════════════════════════════════════ */
#visionModal {
  display: none; position: fixed; inset: 0; z-index: 50;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,.35);
}
#visionModal.show { display: flex; }
#visionModalCard {
  background: var(--bg-card); border-radius: var(--r); padding: 20px 22px; max-width: 320px;
  box-shadow: var(--shadow-lg); text-align: center;
}
#visionModalCard h3 { margin-bottom: 8px; font-size: 15px; }
#visionModalCard p { margin-bottom: 16px; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
#visionModalCard button {
  background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm);
  padding: 10px 22px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px;
}

/* ═══════════════════════════════════════════════════════════════════════
   14. RESPONSIVE
   ═══════════════════════════════════════════════════════════════════════ */
@media (max-width: 520px) {
  #bar { padding: 8px 12px; }
  #log { padding: 10px 8px; }
  .bubble { max-width: 92%; padding: 10px 14px; }
  body.codeweb-mode #inputBar { margin: 6px 8px; }
  #mainSplit.codeweb-on { flex-direction: column; }
  #mainSplit.codeweb-on #logScroll { flex: 0 1 58%; width: 100%; }
  #mainSplit.codeweb-on #codewebPane { flex: 0 0 42%; width: 100%; }
  #mainSplit.codeweb-on #codewebResizer { flex: 0 0 8px; width: 100%; height: 8px; cursor: row-resize; }
  #codewebResizer::before { left: 0; top: 3px; width: 100%; height: 1px; }
  #codewebResizerGrip { width: 28px; height: 4px; }
  #codewebResizer:hover #codewebResizerGrip,
  #codewebResizer.cw-dragging #codewebResizerGrip { width: 40px; height: 4px; }
  #mainSplit.cw-resizing { cursor: row-resize; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div id="status"><span id="dot"></span><span id="statusText">Connecting…</span></div>
    <div id="meta"></div>
  </div>
  <div id="mainSplit">
    <div id="logScroll"><div id="log"></div>
      <button id="jumpToBottomBtn" type="button" title="Xuống tin nhắn mới nhất">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        Tin mới
      </button>
    </div>
    <div id="codewebResizer" title="Kéo để đổi tỉ lệ"><div id="codewebResizerGrip"></div></div>
    <div id="codewebPane">
      <div id="codewebToolbar">
        <div id="codewebTabs"></div>
        <div id="codewebToolbarBtns">
          <button id="codewebReloadBtn" title="Tải lại preview">⟳</button>
          <button id="codewebSettingsBtn" title="Cài đặt khung xem">⚙</button>
        </div>
      </div>
      <div id="codewebSettingsPanel">
        <div class="cw-settings-title">Khung xem (tỉ lệ)</div>
        <div id="codewebRatioOptions">
          <button data-ratio="none">Tự do</button>
          <button data-ratio="16:9">16:9</button>
          <button data-ratio="9:16">9:16</button>
          <button data-ratio="4:3">4:3</button>
          <button data-ratio="1:1">1:1</button>
          <button data-ratio="20:9">20:9</button>
        </div>
      </div>
      <div id="codewebFrameWrap">
        <iframe id="codewebFrame" sandbox="allow-scripts allow-same-origin" title="live preview"></iframe>
      </div>
      <div id="codewebEmpty">Chưa có preview — đợi AI viết file HTML…</div>
    </div>
  </div>
  <iframe id="codewebSandboxFrame" sandbox="allow-scripts allow-same-origin"
          style="position:fixed;left:-9999px;top:-9999px;width:1280px;height:800px;border:0"
          aria-hidden="true"></iframe>
  <div id="imgPreviewBar"></div>
  <div id="inputBar">
    <div id="slashHint"></div>
    <button id="ctrlBtn" title="Ngắt (Ctrl-C)">^C</button>
    <input id="imgInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple />
    <button id="imgBtn" title="Đính kèm ảnh" aria-label="Đính kèm ảnh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>
    <textarea id="inputField" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" rows="1" placeholder="Gõ lệnh hoặc tin nhắn…"></textarea>
    <button id="sendBtn" title="Gửi" aria-label="Gửi">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<div id="visionModal">
  <div id="visionModalCard">
    <h3>Model không hỗ trợ ảnh</h3>
    <p>Model hiện tại đã từ chối ảnh. Nút đính kèm ảnh đã tạm khoá — bạn vẫn có thể chat bằng văn bản.</p>
    <button id="visionModalOk">Đã hiểu</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   1. DOM REFERENCES
   ═══════════════════════════════════════════════════════════════════════ */
const logEl = document.getElementById("log");
const scrollEl = document.getElementById("logScroll");
const jumpBtn = document.getElementById("jumpToBottomBtn");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const metaEl = document.getElementById("meta");
const inputField = document.getElementById("inputField");
const sendBtn = document.getElementById("sendBtn");
const ctrlBtn = document.getElementById("ctrlBtn");
const imgBtn = document.getElementById("imgBtn");
const imgInput = document.getElementById("imgInput");
const imgPreviewBar = document.getElementById("imgPreviewBar");
const visionModal = document.getElementById("visionModal");
const visionModalOk = document.getElementById("visionModalOk");
const mainSplitEl = document.getElementById("mainSplit");
const codewebPaneEl = document.getElementById("codewebPane");
const codewebTabsEl = document.getElementById("codewebTabs");
const codewebResizerEl = document.getElementById("codewebResizer");
const codewebFrameEl = document.getElementById("codewebFrame");
const codewebFrameWrapEl = document.getElementById("codewebFrameWrap");
const codewebSandboxFrameEl = document.getElementById("codewebSandboxFrame");
const codewebReloadBtnEl = document.getElementById("codewebReloadBtn");
const codewebSettingsBtnEl = document.getElementById("codewebSettingsBtn");
const codewebSettingsPanelEl = document.getElementById("codewebSettingsPanel");
const codewebRatioOptionsEl = document.getElementById("codewebRatioOptions");
const slashHintEl = document.getElementById("slashHint");
const barEl = document.getElementById("bar");

/* ═══════════════════════════════════════════════════════════════════════
   2. STATE VARIABLES
   ═══════════════════════════════════════════════════════════════════════ */
let ws = null;
let pendingImages = [];
let visionBlocked = false;
let currentModelKey = "";
const MAX_IMAGES_PER_TURN = 6;

let currentTurnLogs = null;
let currentTurnLogsInner = null;
let currentTurnToggleRow = null;
let lastClosedTurnLogs = null;
let lastClosedTurnToggleRow = null;
let currentGroup = null;

let curTextRow = null;
let curThinkRow = null;
let curTextRaw = "";
let curThinkRaw = "";
let curTextRaf = null, curTextDirty = false;
let curThinkRaf = null, curThinkDirty = false;

let busyRow = null;
let isBusy = false;
let modelPickerLocked = false;

// Live slot
const MIN_LIVE_MS = 550;
let liveSlotEl = null;
let liveSourceEl = null;
let liveShownAt = 0;
let liveCollapseTimer = null;
let livePendingSource = null;
let livePendingTimer = null;

// Spinner
const SPINNER_FRAMES = ["─", "\\", "│", "/", "─", "\\", "│", "/"];
const SPINNER_RAIN = "01アイウエオカキクケコサシスセソタチツテトナニヌネノ";
let spinnerTimer = null;
let spinnerFrameIdx = 0;
let spinnerStartT = 0;
let spinnerRainBuf = ["  ", "  ", "  "];

// Slash commands
let slashMatches = [];
let slashActiveIdx = -1;

// Codeweb
let codewebFiles = {};
let codewebActivePath = null;
let codewebRatio = "none";
let currentAgent = "";
let codewebServerUrl = null;
const CW_FAKE_BASE = "https://codeweb-preview.invalid/";
const CW_RESIZE_MIN_PCT = 20;
const CW_RESIZE_MAX_PCT = 80;
let cwResizing = false;
let logScrollFlexBasisPct = null;
let _codewebRecoveringNav = false;
let _codewebFrameGen = 0;
let _codewebAutoPreviewQueue = Promise.resolve();

/* ═══════════════════════════════════════════════════════════════════════
   3. UTILITIES
   ═══════════════════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const CW_TRAILING_PUNCT_RE = /[.,;:!?)\]}'\"]+$/;
function linkifyHtml(escapedText) {
  return String(escapedText ?? "").replace(/https?:\/\/[^\s<>"'`*]+/g, (url) => {
    let trailing = "";
    const m = url.match(CW_TRAILING_PUNCT_RE);
    if (m) { trailing = m[0]; url = url.slice(0, -trailing.length); }
    if (!url) return url + trailing;
    const hrefSafe = url.replace(/"/g, "&quot;");
    return `<a href="${hrefSafe}" class="cw-chat-link" data-cw-link="1" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
  });
}

// Markdown mở rộng (không phụ thuộc thư viện ngoài) → HTML cho tin nhắn AI
// Hỗ trợ đủ kiểu output khác nhau của Solar / DeepSeek / Qwen / GLM / GPT / Gemini / model nhỏ khác:
// bold/italic/strike, inline code, heading, ul/ol lồng nhau, task list, blockquote,
// bảng, code fence (kể cả chưa đóng do đang stream), code thụt lề 4 space, hr, link, <br> thô.
function mdInlineToHtml(escapedText) {
  let s = escapedText;
  // inline code `code` (ưu tiên trước để không bị bold/italic ăn vào bên trong)
  s = s.replace(/`([^`\n]+)`/g, (_, code) => `<code class="inline-code">${code}</code>`);
  // bold+italic ***text*** hoặc ___text___
  s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/___([^_\n]+)___/g, "<strong><em>$1</em></strong>");
  // bold **text** hoặc __text__
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_\n]+)__/g, "<strong>$1</strong>");
  // strikethrough ~~text~~
  s = s.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  // italic *text* hoặc _text_ (tránh đụng bullet "* " hoặc "**")
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_a-zA-Z0-9])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>");
  // <br> thô mà model đôi khi chèn thẳng (đã escape thành &lt;br&gt;) → xuống dòng thật
  s = s.replace(/&lt;br\s*\/?&gt;/gi, "<br/>");
  return linkifyHtml(s);
}

function escLangClass(lang) {
  return String(lang || "").toLowerCase().replace(/[^a-z0-9+#-]/g, "");
}

// Nhãn hiển thị đẹp cho vài ngôn ngữ hay gặp
const LANG_DISPLAY = {
  js: "javascript", ts: "typescript", py: "python", sh: "bash", shell: "bash",
  yml: "yaml", md: "markdown", "c++": "cpp", "c#": "csharp", jsx: "jsx", tsx: "tsx",
};
function langDisplayName(lang) {
  const l = String(lang || "").trim().toLowerCase();
  if (!l) return "code";
  return LANG_DISPLAY[l] || l;
}

function renderCodeBlock(lang, code) {
  code = code.replace(/\n$/, "");
  const langClass = escLangClass(lang);
  const codeEsc = escapeHtml(code);
  return `<div class="code-block${langClass ? " lang-" + langClass : ""}">` +
         `<div class="code-block-head"><span class="code-lang">${escapeHtml(langDisplayName(lang))}</span>` +
         `<button type="button" class="code-copy-btn" onclick="cwCopyCode(this)">Copy</button></div>` +
         `<pre class="mono"><code>${codeEsc}</code></pre></div>`;
}

// Parse một bảng markdown bắt đầu tại lines[startIdx]. Trả về {html, nextIdx} hoặc null nếu không phải bảng.
function tryParseTable(lines, startIdx) {
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l) || (l.includes("|") && l.trim() !== "");
  const headerLine = lines[startIdx];
  const sepLine = lines[startIdx + 1];
  if (!headerLine || !sepLine) return null;
  if (!headerLine.includes("|")) return null;
  if (!/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(sepLine)) return null;

  const splitRow = (l) => {
    let t = l.trim();
    if (t.startsWith("|")) t = t.slice(1);
    if (t.endsWith("|")) t = t.slice(0, -1);
    return t.split("|").map(c => c.trim());
  };
  const aligns = splitRow(sepLine).map(c => {
    const left = c.startsWith(":"), right = c.endsWith(":");
    if (left && right) return "center"; if (right) return "right"; if (left) return "left"; return "";
  });
  const headers = splitRow(headerLine);
  let idx = startIdx + 2;
  const rows = [];
  while (idx < lines.length && isRow(lines[idx]) && lines[idx].trim() !== "") {
    rows.push(splitRow(lines[idx])); idx++;
  }
  let html = '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
  headers.forEach((h, i) => {
    const al = aligns[i] ? ` style="text-align:${aligns[i]}"` : "";
    html += `<th${al}>${mdInlineToHtml(escapeHtml(h))}</th>`;
  });
  html += "</tr></thead><tbody>";
  rows.forEach(r => {
    html += "<tr>";
    headers.forEach((_, i) => {
      const al = aligns[i] ? ` style="text-align:${aligns[i]}"` : "";
      html += `<td${al}>${mdInlineToHtml(escapeHtml(r[i] ?? ""))}</td>`;
    });
    html += "</tr>";
  });
  html += "</tbody></table></div>";
  return { html, nextIdx: idx };
}

function markdownToHtml(raw) {
  const src = String(raw ?? "");
  // Tách theo code fence ``` hoặc ~~~ trước, để không markdown-hoá bên trong code block.
  // Regex bắt cả fence chưa đóng (model đang stream dở) nhờ nhóm cuối optional.
  const FENCE_RE = /(?:```|~~~)([^\n]*)\n([\s\S]*?)(?:```|~~~|$)/g;
  let out = "";
  let lastIndex = 0;
  let m;
  while ((m = FENCE_RE.exec(src)) !== null) {
    const before = src.slice(lastIndex, m.index);
    out += renderMdBlocks(before);
    out += renderCodeBlock(m[1], m[2]);
    lastIndex = FENCE_RE.lastIndex;
  }
  out += renderMdBlocks(src.slice(lastIndex));
  return out;
}

function renderMdBlocks(text) {
  const lines = text.split("\n");
  let html = "";
  let quoteBuf = [];
  let paraBuf = [];

  function flushQuote() {
    if (quoteBuf.length) {
      html += `<blockquote class="md-quote">${mdInlineToHtml(escapeHtml(quoteBuf.join(" ")))}</blockquote>`;
      quoteBuf = [];
    }
  }
  function flushPara() {
    if (paraBuf.length) {
      html += `<p class="md-p">${mdInlineToHtml(escapeHtml(paraBuf.join("\n")))}</p>`;
      paraBuf = [];
    }
  }

  // Gom một khối list (thường + task, có thể lồng nhau qua thụt lề) thành cây rồi render đúng chuẩn HTML
  function isListLine(l) {
    return /^(\s*)\d+[.)]\s+.*$/.test(l) || /^(\s*)[-*+]\s+.*$/.test(l);
  }
  function parseListItem(l) {
    let m = l.match(/^(\s*)[-*+]\s+\[( |x|X)\]\s+(.*)$/);
    if (m) return { indent: m[1].length, type: "ul", task: true, checked: /x/i.test(m[2]), content: m[3] };
    m = l.match(/^(\s*)\d+[.)]\s+(.*)$/);
    if (m) return { indent: m[1].length, type: "ol", task: false, content: m[2] };
    m = l.match(/^(\s*)[-*+]\s+(.*)$/);
    if (m) return { indent: m[1].length, type: "ul", task: false, content: m[2] };
    return null;
  }
  function renderListItems(items) {
    // items: flat array with .indent, builds nested <ul>/<ol> using a stack-based tree
    let out = "";
    let stack = []; // {type, indent, hasTask}
    for (let k = 0; k < items.length; k++) {
      const it = items[k];
      while (stack.length && it.indent < stack[stack.length - 1].indent) {
        out += "</li>"; out += stack.pop().type === "ol" ? "</ol>" : "</ul>";
      }
      if (!stack.length || it.indent > stack[stack.length - 1].indent) {
        out += it.type === "ol" ? '<ol class="md-list">' : `<ul class="md-list${it.task ? " task-list" : ""}">`;
        stack.push({ type: it.type, indent: it.indent });
      } else if (it.indent === stack[stack.length - 1].indent) {
        if (stack[stack.length - 1].type !== it.type) {
          out += "</" + (stack.pop().type === "ol" ? "ol" : "ul") + ">";
          out += it.type === "ol" ? '<ol class="md-list">' : `<ul class="md-list${it.task ? " task-list" : ""}">`;
          stack.push({ type: it.type, indent: it.indent });
        } else {
          out += "</li>";
        }
      }
      if (it.task) {
        out += `<li class="task-item"><span class="task-box${it.checked ? " checked" : ""}">${it.checked ? "✓" : ""}</span><span class="${it.checked ? "task-done" : ""}">${mdInlineToHtml(escapeHtml(it.content))}</span>`;
      } else {
        out += `<li>${mdInlineToHtml(escapeHtml(it.content))}`;
      }
    }
    while (stack.length) { out += "</li>"; out += stack.pop().type === "ol" ? "</ol>" : "</ul>"; }
    return out;
  }

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // Bảng markdown
    const table = tryParseTable(lines, i);
    if (table) {
      flushPara(); flushQuote();
      html += table.html; i = table.nextIdx; continue;
    }

    // Khối list liên tiếp (kể cả lồng nhau qua thụt lề) → gom hết rồi render 1 lần
    if (isListLine(line)) {
      flushPara(); flushQuote();
      const items = [];
      let j = i;
      while (j < lines.length && (isListLine(lines[j]) || (lines[j].trim() !== "" && /^\s+/.test(lines[j]) && items.length))) {
        const item = parseListItem(lines[j]);
        if (item) { items.push(item); j++; }
        else break;
      }
      html += renderListItems(items);
      i = j; continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    const hr = line.match(/^\s*([-*_])\s*(?:\1\s*){2,}$/);
    const indentedCode = line.match(/^(?: {4}|\t)(.*)$/);

    if (heading) {
      flushPara(); flushQuote();
      const level = Math.min(heading[1].length, 6);
      html += `<h${level} class="md-h">${mdInlineToHtml(escapeHtml(heading[2]))}</h${level}>`;
      i++; continue;
    }
    if (hr) {
      flushPara(); flushQuote();
      html += `<hr class="md-hr"/>`;
      i++; continue;
    }
    const quote = line.match(/^\s*>\s?(.*)$/);
    if (quote) {
      flushPara();
      quoteBuf.push(quote[1]);
      i++; continue;
    }
    if (indentedCode && paraBuf.length === 0) {
      // Block code thụt lề 4 space (không có ```), gom các dòng liên tiếp
      flushQuote();
      const codeLines = [indentedCode[1]];
      let j = i + 1;
      while (j < lines.length && /^(?: {4}|\t)/.test(lines[j])) {
        codeLines.push(lines[j].replace(/^(?: {4}|\t)/, "")); j++;
      }
      html += renderCodeBlock("", codeLines.join("\n"));
      i = j; continue;
    }
    if (line.trim() === "") {
      flushPara(); flushQuote();
      i++; continue;
    }
    // dòng văn bản thường → gom vào đoạn văn hiện tại
    flushQuote();
    paraBuf.push(line);
    i++;
  }
  flushPara(); flushQuote();
  return html;
}

function cwCopyCode(btn) {
  const block = btn.closest(".code-block");
  const codeEl = block && block.querySelector("code");
  if (!codeEl) return;
  const text = codeEl.textContent;
  const done = () => { const old = btn.textContent; btn.textContent = "Copied!"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta);
    done();
  }
}

// ANSI → HTML
function xterm256ToHex(n) {
  n = Number(n);
  if (Number.isNaN(n)) return null;
  if (n < 16) {
    const basic = ["#000000","#800000","#008000","#808000","#4a5a72","#800080","#008080","#c0c0c0",
                    "#808080","#ff0000","#00ff00","#ffff00","#6b85a8","#ff00ff","#00ffff","#ffffff"];
    return basic[n];
  }
  if (n <= 231) {
    if (n === 220) return "#8a5a00";
    if (n === 229) return "#7a6a1a";
    const i = n - 16;
    const levels = [0, 95, 135, 175, 215, 255];
    const r = levels[Math.floor(i / 36) % 6];
    const g = levels[Math.floor(i / 6) % 6];
    const b = levels[i % 6];
    return `rgb(${r},${g},${b})`;
  }
  const gray = 8 + (n - 232) * 10;
  return `rgb(${gray},${gray},${gray})`;
}

function ansiToHtml(raw) {
  const s = String(raw ?? "");
  const ANSI_RE = /\x1b\[([0-9;]*)m/g;
  let out = "", openSpans = 0, lastIndex = 0;
  let curColor = null, curBold = false, curDim = false;
  function closeAll() { while (openSpans > 0) { out += "</span>"; openSpans--; } }
  function openSpan() {
    const styles = [];
    if (curColor) styles.push(`color:${curColor}`);
    if (curBold) styles.push("font-weight:bold");
    if (curDim) styles.push("opacity:0.65");
    if (styles.length) { out += `<span style="${styles.join(";")}">`; openSpans++; }
  }
  let m, pendingRestyle = false;
  while ((m = ANSI_RE.exec(s)) !== null) {
    const chunk = s.slice(lastIndex, m.index);
    if (chunk) { if (pendingRestyle) { closeAll(); openSpan(); pendingRestyle = false; } out += escapeHtml(chunk); }
    lastIndex = ANSI_RE.lastIndex;
    const codes = m[1].split(";").filter(c => c !== "");
    if (codes.length === 0) codes.push("0");
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (c === "0") { curColor = null; curBold = false; curDim = false; pendingRestyle = true; }
      else if (c === "1") { curBold = true; pendingRestyle = true; }
      else if (c === "2") { curDim = true; pendingRestyle = true; }
      else if (c === "38" && codes[i+1] === "5") {
        const hex = xterm256ToHex(codes[i+2]);
        if (hex) { curColor = hex; pendingRestyle = true; }
        i += 2;
      }
    }
  }
  const tail = s.slice(lastIndex);
  if (tail) { if (pendingRestyle) { closeAll(); openSpan(); } out += escapeHtml(tail); }
  closeAll();
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════
   4. SCROLL MANAGEMENT
   ═══════════════════════════════════════════════════════════════════════ */
function isNearBottom() {
  return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120;
}

// ── Auto-scroll "pinned to bottom" ──────────────────────────────────────
// Nguyên tắc: chỉ tự cuộn khi có DÒNG MỚI thật sự (chiều cao nội dung tăng),
// không cuộn theo từng ký tự delta. Nếu người dùng đã tự kéo lên xem lại,
// ngưng hẳn auto-scroll cho tới khi họ tự kéo về gần đáy hoặc bấm nút "↓ mới".
let isPinned = true;
let lastScrollHeight = 0;
let scrollAnimId = null;

function animateScrollTo(targetTop, duration) {
  if (scrollAnimId) cancelAnimationFrame(scrollAnimId);
  const startTop = scrollEl.scrollTop;
  const delta = targetTop - startTop;
  if (Math.abs(delta) < 1) return;
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic, mượt và không giật
    scrollEl.scrollTop = startTop + delta * eased;
    if (t < 1) { scrollAnimId = requestAnimationFrame(step); }
    else { scrollAnimId = null; }
  }
  scrollAnimId = requestAnimationFrame(step);
}

// Gọi khi có nội dung mới được thêm vào log (bubble mới, dòng mới trong stream…).
// Chỉ thực sự cuộn nếu đang pinned VÀ chiều cao nội dung có tăng (dòng mới thật sự).
function scrollToBottom(opts) {
  const force = opts && opts.force;
  const instant = opts && opts.instant;
  if (force) isPinned = true;
  const newHeight = scrollEl.scrollHeight;
  const grew = newHeight > lastScrollHeight;
  lastScrollHeight = newHeight;
  updateJumpToBottomBtn();
  if (!isPinned) return; // user đang xem lại → không đụng vào scroll của họ
  if (!grew && !force) return; // không có dòng mới thật sự thì khỏi cuộn
  const target = scrollEl.scrollHeight - scrollEl.clientHeight;
  if (instant) { if (scrollAnimId) cancelAnimationFrame(scrollAnimId); scrollEl.scrollTop = target; }
  else animateScrollTo(target, 220);
}

function updateJumpToBottomBtn() {
  if (!jumpBtn) return;
  jumpBtn.classList.toggle("show", !isPinned);
}

function jumpToBottom() {
  isPinned = true;
  if (scrollAnimId) cancelAnimationFrame(scrollAnimId);
  scrollEl.scrollTop = scrollEl.scrollHeight - scrollEl.clientHeight;
  updateJumpToBottomBtn();
}

// User tự kéo → nếu họ rời khỏi đáy, unpin (ngưng hẳn auto-scroll cho tới khi quay lại đáy)
let scrollUserIntentTimer = null;
scrollEl.addEventListener("scroll", () => {
  if (scrollUserIntentTimer) clearTimeout(scrollUserIntentTimer);
  scrollUserIntentTimer = setTimeout(() => {
    isPinned = isNearBottom();
    updateJumpToBottomBtn();
  }, 60);
}, { passive: true });
scrollEl.addEventListener("wheel", () => { isPinned = false; if (scrollAnimId) cancelAnimationFrame(scrollAnimId); }, { passive: true });
scrollEl.addEventListener("touchstart", () => { isPinned = false; if (scrollAnimId) cancelAnimationFrame(scrollAnimId); }, { passive: true });
if (jumpBtn) jumpBtn.addEventListener("click", jumpToBottom);

/* ═══════════════════════════════════════════════════════════════════════
   5. ANIMATION CLEANUP
   ═══════════════════════════════════════════════════════════════════════ */
document.addEventListener("animationend", (ev) => {
  const t = ev.target;
  if (t && t.style && (ev.animationName === "fadeIn" || ev.animationName === "bubbleUser" || ev.animationName === "bubbleAi")) {
    t.style.willChange = "auto";
  }
});
document.addEventListener("transitionend", (ev) => {
  const t = ev.target;
  if (t && t.classList && t.classList.contains("live-slot") && (ev.propertyName === "transform" || ev.propertyName === "opacity")) {
    if (t.classList.contains("entering")) t.style.willChange = "auto";
  }
});

/* ═══════════════════════════════════════════════════════════════════════
   6. TURN MANAGEMENT
   ═══════════════════════════════════════════════════════════════════════ */
function ensureTurnLogs() {
  if (currentTurnLogsInner) return currentTurnLogsInner;
  currentTurnLogs = document.createElement("div");
  currentTurnLogs.className = "turn-logs";
  currentTurnLogsInner = document.createElement("div");
  currentTurnLogsInner.className = "turn-logs-inner";
  currentTurnLogs.appendChild(currentTurnLogsInner);
  logEl.appendChild(currentTurnLogs);
  return currentTurnLogsInner;
}

function syncTurnToggleLabel(btn) {
  const label = btn && btn.querySelector(".label");
  if (!label) return;
  const isCodeweb = document.body.classList.contains("codeweb-mode");
  const isOpen = btn.classList.contains("open");
  label.textContent = isCodeweb ? "bước" : (isOpen ? "Ẩn chi tiết" : "Xem chi tiết");
  btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
}

function ensureTurnToggle(logsEl) {
  const row = document.createElement("div");
  row.className = "turn-toggle-row";
  const btn = document.createElement("button");
  btn.className = "turn-toggle";
  btn.innerHTML = '<span class="chev">▶</span><span class="label"></span><span class="tool-count">0</span>';
  syncTurnToggleLabel(btn);
  btn.addEventListener("click", () => {
    const open = logsEl.classList.toggle("open");
    btn.classList.toggle("open", open);
    syncTurnToggleLabel(btn);
    if (open) scrollToBottom({ force: true });
  });
  row.appendChild(btn);
  logEl.appendChild(row);
  logEl.appendChild(logsEl);
  return row;
}

function updateTurnToggleCount(row, logsEl) {
  if (!row || !logsEl) return;
  const n = logsEl.querySelectorAll(".tool-group, .info-card").length;
  const countEl = row.querySelector(".tool-count");
  if (countEl) countEl.textContent = String(n);
}

function turnLogTarget() { return ensureTurnLogs(); }

function closeTurnLogs() {
  if (currentTurnLogs) {
    const row = ensureTurnToggle(currentTurnLogs);
    updateTurnToggleCount(row, currentTurnLogs);
    lastClosedTurnLogs = currentTurnLogsInner;
    lastClosedTurnToggleRow = row;
  }
  currentTurnLogs = null;
  currentTurnLogsInner = null;
  collapseLiveSlot();
}

/* ═══════════════════════════════════════════════════════════════════════
   7. LIVE SLOT PREVIEW
   ═══════════════════════════════════════════════════════════════════════ */
function collapseLiveSlot() {
  livePendingSource = null;
  clearTimeout(livePendingTimer);
  if (!liveSlotEl) return;
  const el = liveSlotEl;
  liveSlotEl = null; liveSourceEl = null;
  el.classList.add("collapsing"); el.classList.remove("entering");
  clearTimeout(liveCollapseTimer);
  liveCollapseTimer = setTimeout(() => { el.remove(); }, 320);
}

function mountLiveSlot(sourceEl) {
  const slot = document.createElement("div");
  slot.className = "live-slot";
  const inner = document.createElement("div");
  inner.appendChild(sourceEl.cloneNode(true));
  slot.appendChild(inner);
  document.body.appendChild(slot);
  liveSlotEl = slot; liveSourceEl = sourceEl; liveShownAt = performance.now();
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { if (liveSlotEl === slot) slot.classList.add("entering"); });
  });
}

function showLiveSlot(sourceEl) {
  if (liveSourceEl === sourceEl && liveSlotEl) {
    const inner = liveSlotEl.firstElementChild;
    inner.replaceChildren(sourceEl.cloneNode(true));
    return;
  }
  const elapsed = performance.now() - liveShownAt;
  if (liveSlotEl && elapsed < MIN_LIVE_MS) {
    livePendingSource = sourceEl;
    clearTimeout(livePendingTimer);
    livePendingTimer = setTimeout(() => {
      const next = livePendingSource; livePendingSource = null;
      if (!next) return;
      collapseLiveSlot(); mountLiveSlot(next);
    }, MIN_LIVE_MS - elapsed);
    return;
  }
  collapseLiveSlot(); mountLiveSlot(sourceEl);
}

/* ═══════════════════════════════════════════════════════════════════════
   8. DOM APPEND HELPERS
   ═══════════════════════════════════════════════════════════════════════ */
function appendRow(html, cls) {
  const div = document.createElement("div");
  div.className = "row" + (cls ? " " + cls : "");
  div.innerHTML = html; logEl.appendChild(div);
  scrollToBottom(); return div;
}

function appendLogRow(html, cls) {
  const div = document.createElement("div");
  div.className = "row" + (cls ? " " + cls : "");
  div.innerHTML = html; turnLogTarget().appendChild(div);
  showLiveSlot(div); scrollToBottom(); return div;
}

function appendInfoCard(html, extraCls) {
  currentGroup = null;
  const div = document.createElement("div");
  div.className = "row info-card" + (extraCls ? " " + extraCls : "");
  div.innerHTML = html; turnLogTarget().appendChild(div);
  showLiveSlot(div); scrollToBottom(); return div;
}

function appendStandaloneCard(html, extraCls) {
  currentGroup = null;
  const div = document.createElement("div");
  div.className = "row info-card" + (extraCls ? " " + extraCls : "");
  div.innerHTML = html; logEl.appendChild(div);
  closeTurnLogs(); scrollToBottom({ force: true }); return div;
}

function openToolGroup(name, icon, previewHtml, denied) {
  const wrap = document.createElement("div");
  wrap.className = "row tool-group" + (denied ? " denied" : "");
  wrap.innerHTML = `<div class="tool-group-head">`
    + `<span class="tool-icon">${icon}</span>`
    + `<span class="tool-name">${escapeHtml(name)}</span>`
    + (previewHtml ? `<span class="tool-brief">${previewHtml}</span>` : "")
    + `</div><div class="tool-children"></div>`;
  turnLogTarget().appendChild(wrap);
  currentGroup = wrap; showLiveSlot(wrap); scrollToBottom(); return wrap;
}

function appendGroupChild(html, extraCls) {
  if (!currentGroup) return appendInfoCard(html, extraCls);
  const children = currentGroup.querySelector(".tool-children");
  const child = document.createElement("div");
  child.className = "tool-child" + (extraCls ? " " + extraCls : "");
  child.innerHTML = html; children.appendChild(child);
  if (liveSourceEl === currentGroup) showLiveSlot(currentGroup);
  scrollToBottom(); return child;
}

function appendBubble(html, from) {
  currentGroup = null;
  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap from-" + from;
  const bubble = document.createElement("div");
  bubble.className = "bubble " + (from === "user" ? "user" : "ai");
  bubble.innerHTML = html; wrap.appendChild(bubble);
  logEl.appendChild(wrap); closeTurnLogs();
  scrollToBottom({ force: true }); return bubble;
}

/* ═══════════════════════════════════════════════════════════════════════
   9. STREAMING TEXT
   ═══════════════════════════════════════════════════════════════════════ */
function resetStreamRows() {
  if (curTextRow) {
    const body = curTextRow.querySelector(".ai-body");
    if (body) body.classList.remove("streaming");
  }
  if (curTextRaf) { cancelAnimationFrame(curTextRaf); curTextRaf = null; }
  if (curThinkRaf) { cancelAnimationFrame(curThinkRaf); curThinkRaf = null; }
  curTextRow = null; curThinkRow = null; curTextRaw = ""; curThinkRaw = "";
  curTextDirty = false; curThinkDirty = false;
}

function appendTextDelta(text) {
  if (!curTextRow) { curTextRow = appendBubble('<span class="ai-body streaming"></span>', "ai"); curTextRaw = ""; curTextDirty = false; }
  curTextRaw += text;
  scheduleTextFlush();
}

function scheduleTextFlush() {
  curTextDirty = true;
  if (curTextRaf) return;
  curTextRaf = requestAnimationFrame(() => {
    curTextRaf = null;
    if (!curTextDirty || !curTextRow) return;
    curTextDirty = false;
    const body = curTextRow.querySelector(".ai-body");
    if (body) body.innerHTML = markdownToHtml(curTextRaw);
    scrollToBottom();
  });
}

function appendThinkingDelta(text) {
  if (!curThinkRow) {
    currentGroup = null;
    const div = document.createElement("div");
    div.className = "row info-card think";
    div.innerHTML = '<div class="think-label"><span>[thinking]</span></div>'
      + '<div class="think-viewport"><div class="think-body"></div></div>'
      + '<button type="button" class="think-toggle" onclick="toggleThinkCard(this)">Xem đầy đủ</button>';
    logEl.appendChild(div); scrollToBottom({ force: true }); curThinkRow = div;
  }
  curThinkRaw += text;
  scheduleThinkFlush();
}

function scheduleThinkFlush() {
  curThinkDirty = true;
  if (curThinkRaf) return;
  curThinkRaf = requestAnimationFrame(() => {
    curThinkRaf = null;
    if (!curThinkDirty || !curThinkRow) return;
    curThinkDirty = false;
    const bodyEl = curThinkRow.querySelector(".think-body");
    if (bodyEl) bodyEl.textContent = curThinkRaw;
    updateThinkOverflow(curThinkRow);
  });
}

function updateThinkOverflow(card) {
  const viewport = card.querySelector(".think-viewport");
  if (!viewport) return;
  const overflowing = viewport.scrollHeight > viewport.clientHeight + 1;
  card.classList.toggle("has-overflow", overflowing);
  // Luôn giữ dòng mới nhất hiện ra ở đáy khung, trừ khi người dùng đang mở rộng xem toàn bộ
  if (!card.classList.contains("expanded")) viewport.scrollTop = viewport.scrollHeight;
}

function toggleThinkCard(btn) {
  const card = btn.closest(".info-card.think");
  if (!card) return;
  const expanded = card.classList.toggle("expanded");
  btn.textContent = expanded ? "Thu gọn" : "Xem đầy đủ";
  if (!expanded) {
    const viewport = card.querySelector(".think-viewport");
    if (viewport) viewport.scrollTop = viewport.scrollHeight;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   10. TOOL PREVIEW FORMATTING
   ═══════════════════════════════════════════════════════════════════════ */
const TOOL_ICON = {
  bash:"⚙", read:"📄", write:"✏", edit:"✏", multiedit:"✏",
  glob:"🔍", grep:"🔍", webfetch:"🌐", websearch:"🌐",
  todowrite:"☑", todoread:"☑", task:"🤖",
};
const PREVIEW_MAIN_ARG = {
  bash:"command", read:"path", write:"path", edit:"path",
  multiedit:"path", glob:"pattern", grep:"pattern",
  webfetch:"url", websearch:"query", skill:"name",
  apply_patch:"path", view_symbol:"path", verify:"path",
};

function formatToolPreview(name, args, fallback) {
  if (!args || typeof args !== "object") return escapeHtml(fallback || "");
  const key = PREVIEW_MAIN_ARG[name];
  let main = key && args[key] != null ? String(args[key]) : null;
  if (main == null) {
    const firstStr = Object.values(args).find(v => typeof v === "string");
    main = firstStr != null ? firstStr : (fallback || "");
  }
  const oneLine = main.replace(/\s*\n\s*/g, " ⏎ ");
  return escapeHtml(oneLine.length > 200 ? oneLine.slice(0, 200) + "…" : oneLine);
}

/* ═══════════════════════════════════════════════════════════════════════
   11. BUSY/LOCK STATE
   ═══════════════════════════════════════════════════════════════════════ */
function setBusy(busy) {
  isBusy = busy;
  sendBtn.disabled = busy;
  inputField.disabled = busy;
  imgBtn.disabled = busy || visionBlocked;
  inputField.placeholder = busy ? "Đang xử lý…" : "Gõ lệnh hoặc tin nhắn…";
  if (busy) startSpinner(); else stopSpinner();
}

function setModelPickerLock(locked) {
  modelPickerLocked = locked;
  sendBtn.disabled = locked || isBusy;
  inputField.disabled = locked || isBusy;
  imgBtn.disabled = locked || isBusy || visionBlocked;
  if (locked) inputField.placeholder = "Hãy chọn 1 mục ở trên trước";
  else if (!isBusy) inputField.placeholder = "Gõ lệnh hoặc tin nhắn…";
}

/* ═══════════════════════════════════════════════════════════════════════
   12. SPINNER
   ═══════════════════════════════════════════════════════════════════════ */
function spinnerTick() {
  if (!busyRow) return;
  const frame = SPINNER_FRAMES[spinnerFrameIdx % SPINNER_FRAMES.length];
  const elapsed = (Date.now() - spinnerStartT) / 1000;
  const elapsedStr = elapsed >= 1 ? ` ${elapsed.toFixed(1)}s` : "";
  if (spinnerFrameIdx % 2 === 0) {
    spinnerRainBuf = [0,0,0].map(() => SPINNER_RAIN[Math.floor(Math.random() * SPINNER_RAIN.length)]);
  }
  const frameEl = busyRow.querySelector(".spinner-frame");
  const rainEl = busyRow.querySelector(".spinner-rain");
  const timeEl = busyRow.querySelector(".spinner-time");
  if (frameEl) frameEl.textContent = frame;
  if (rainEl) rainEl.textContent = spinnerRainBuf.join("");
  if (timeEl) timeEl.textContent = elapsedStr;
  spinnerFrameIdx++;
}

function startSpinner() {
  if (busyRow) return;
  busyRow = appendRow(
    '<span class="spinner-row">'
    + '<span class="spinner-frame">─</span>'
    + '<span class="spinner-label">Thinking</span>'
    + '<span class="spinner-rain">  </span>'
    + '<span class="spinner-time"></span>'
    + '</span>', "busy-row"
  );
  spinnerFrameIdx = 0; spinnerStartT = Date.now();
  spinnerTimer = setInterval(spinnerTick, 90);
}

function stopSpinner() {
  if (spinnerTimer) { clearInterval(spinnerTimer); spinnerTimer = null; }
  if (busyRow) { busyRow.remove(); busyRow = null; }
}

/* ═══════════════════════════════════════════════════════════════════════
   13. EVENT HANDLER
   ═══════════════════════════════════════════════════════════════════════ */
function handleEvent(msg) {
  const t = msg.type;
  const d = msg.data || {};

  if (t !== "text_delta" && curTextRow) {
    const body = curTextRow.querySelector(".ai-body");
    if (body) body.classList.remove("streaming");
    curTextRow = null;
  }
  if (t !== "thinking_delta" && curThinkRow) {
    if (curThinkRaf) { cancelAnimationFrame(curThinkRaf); curThinkRaf = null; }
    curThinkRow = null; curThinkRaw = ""; curThinkDirty = false;
  }

  switch (t) {
    case "session_init":
      metaEl.textContent = `${d.model||""}  ·  ${d.agent||""}  ·  [${(d.sid||"").slice(0,8)}]`;
      logEl.innerHTML = ""; closeTurnLogs();
      renderHistory(d.messages || []);
      setBusy(!!d.turn_in_progress);
      setCodewebMode(d.agent);
      codewebRestoreFromSessionInit(d.codeweb_preview);
      maybeResetVisionBlock(d.model, d.vision_support);
      break;
    case "turn_start":
      lastClosedTurnLogs = null; lastClosedTurnToggleRow = null;
      setBusy(true); break;
    case "text_delta":
      stopSpinner(); appendTextDelta(d.text || ""); break;
    case "thinking_delta":
      stopSpinner(); appendThinkingDelta(d.text || ""); break;
    case "step":
      currentGroup = null;
      appendInfoCard(`┤ step ${escapeHtml(d.step)}  ctx ~${escapeHtml((d.ctx_est||0).toLocaleString())} tok  model ${escapeHtml(d.model)}`, "step dim");
      break;
    case "tool_start": {
      stopSpinner();
      const icon = TOOL_ICON[d.name] || "⚙";
      const previewText = formatToolPreview(d.name, d.args, d.preview);
      openToolGroup(d.name, icon, `<span class="mono tool-arg-chip">${previewText}</span>`);
      break;
    }
    case "tool_end":
      appendGroupChild(`<span class="mono">╰─ ${ansiToHtml(d.brief)}${d.truncated ? "…" : ""}</span>`, "dim");
      currentGroup = null; break;
    case "tool_denied":
      if (currentGroup) currentGroup.classList.add("denied");
      if (d.by_user) appendGroupChild("✗ Denied by user.", "child-denied");
      else appendGroupChild(`✗ ${escapeHtml(d.name)} denied (agent=${escapeHtml(d.agent)})`, "child-denied");
      currentGroup = null; break;
    case "info":
      if (currentGroup && d.raw) appendGroupChild(`<span class="mono">${ansiToHtml(d.text)}</span>`, "child-info");
      else if (!currentGroup && !currentTurnLogs) appendStandaloneCard(ansiToHtml(d.text), d.raw ? "raw-info" : "info");
      else appendInfoCard(ansiToHtml(d.text), d.raw ? "raw-info" : "info");
      break;
    case "warn":
      if (currentGroup) appendGroupChild(ansiToHtml(d.text), "child-warn");
      else appendStandaloneCard(ansiToHtml(d.text), "warn");
      break;
    case "error":
      if (currentGroup) appendGroupChild(ansiToHtml(d.text), "child-err");
      else appendStandaloneCard(ansiToHtml(d.text), "err");
      if (d.vision_unsupported) blockVisionForCurrentModel();
      break;
    case "interrupted":
      currentGroup = null;
      appendInfoCard(`checkpoint ${escapeHtml(d.checkpoint_id)} saved after interrupt`, "warn");
      break;
    case "turn_end":
      currentGroup = null; collapseLiveSlot();
      if (d.summary_line) {
        if (lastClosedTurnLogs && lastClosedTurnToggleRow) {
          const div = document.createElement("div");
          div.className = "row info-card dim";
          div.innerHTML = ansiToHtml(d.summary_line);
          lastClosedTurnLogs.appendChild(div);
          updateTurnToggleCount(lastClosedTurnToggleRow, lastClosedTurnLogs);
        } else {
          const logsEl = document.createElement("div"); logsEl.className = "turn-logs";
          const inner = document.createElement("div"); inner.className = "turn-logs-inner";
          logsEl.appendChild(inner); logEl.appendChild(logsEl);
          const div = document.createElement("div");
          div.className = "row info-card dim"; div.innerHTML = ansiToHtml(d.summary_line);
          inner.appendChild(div);
          const row = ensureTurnToggle(logsEl);
          updateTurnToggleCount(row, inner);
        }
      }
      closeTurnLogs(); resetStreamRows(); setBusy(false); break;
    case "session_meta": {
      const cur = metaEl.textContent || "";
      const sidPart = cur.match(/\[[0-9a-fA-F]{1,8}\]/);
      metaEl.textContent = `${d.model||""}  ·  ${d.agent||""}  ·  ${sidPart ? sidPart[0] : ""}`;
      maybeResetVisionBlock(d.model, d.vision_support);
      setCodewebMode(d.agent);
      break;
    }
    case "ask": renderAsk(msg); break;
    case "codeweb_auto_preview": codewebRunAutoPreview(d.path, d.html); break;
    default: appendLogRow(escapeHtml(JSON.stringify(msg)), "dim");
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   14. HISTORY RENDERING
   ═══════════════════════════════════════════════════════════════════════ */
function renderHistory(messages) {
  for (const m of messages) {
    let content = m.content;
    if (Array.isArray(content)) content = content.map(c => (typeof c === "string" ? c : (c.text || ""))).join(" ");
    if (typeof content !== "string") continue;
    if (m.role === "user") {
      if (content.startsWith("[")) continue;
      appendBubble(linkifyHtml(escapeHtml(content)), "user");
    } else if (m.role === "assistant") {
      appendBubble(markdownToHtml(content), "ai");
    }
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   15. MODEL PICKER
   ═══════════════════════════════════════════════════════════════════════ */
function renderModelPicker(msg, answerAndLock) {
  const extra = msg.extra || {};
  const allModels = Array.isArray(extra.models) ? extra.models : [];
  const freeSet = new Set(Array.isArray(extra.free_set) ? extra.free_set : []);
  const isRequesty = !!extra.is_requesty;
  const PAGE_SIZE = 10;
  let query = "", page = 0;

  const wrap = document.createElement("div"); wrap.className = "model-picker";
  const searchWrap = document.createElement("div"); searchWrap.className = "model-picker-search";
  const searchInp = document.createElement("input"); searchInp.type = "text"; searchInp.placeholder = "Tìm model…";
  searchWrap.appendChild(searchInp); wrap.appendChild(searchWrap);
  const listEl = document.createElement("div"); listEl.className = "model-picker-list"; wrap.appendChild(listEl);
  const pagerEl = document.createElement("div"); pagerEl.className = "model-picker-pager"; wrap.appendChild(pagerEl);

  function filtered() {
    if (!query) return allModels;
    const q = query.toLowerCase();
    return allModels.filter(m => m.toLowerCase().includes(q));
  }

  function render(direction) {
    const items = filtered();
    const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (page >= totalPages) page = totalPages - 1;
    if (page < 0) page = 0;
    const start = page * PAGE_SIZE;
    const pageItems = items.slice(start, start + PAGE_SIZE);
    listEl.innerHTML = "";
    listEl.classList.remove("picker-page-next", "picker-page-prev");
    if (pageItems.length === 0) {
      const empty = document.createElement("div"); empty.className = "model-picker-empty";
      empty.textContent = "Không tìm thấy model nào."; listEl.appendChild(empty);
    }
