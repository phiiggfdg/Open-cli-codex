<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Open CLI Codex — Web</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  /* ── Theme: be/kem tinh tế, tương phản vừa đủ để đọc thoải mái lâu dài.
     Font Inter thay Be Vietnam Pro — cùng hỗ trợ dấu tiếng Việt đầy đủ,
     nhưng nét chữ trung tính, hiện đại, ít "bo tròn dễ thương" hơn, hợp
     cảm giác cao cấp/gọn gàng theo yêu cầu. Mono giữ JetBrains Mono cho
     phần cần căn cột (preview lệnh, code, số liệu). */
  :root {
    --bg:          #f6f3ec;   /* be sáng, nền chính */
    --bg-panel:    #fffefb;   /* nền card/bubble */
    --bg-sunken:   #eee9dd;   /* nền lõm nhẹ (thanh trên, input, khối phụ) */
    --border:      #ddd4c0;   /* viền tiêu chuẩn */
    --border-soft: #e9e2d2;   /* viền nhạt hơn, cho card lồng nhau */
    --text:        #3d382e;   /* nâu-xám đậm, dịu hơn đen thuần */
    --text-dim:    #8f8776;
    --accent:      #b08a4e;   /* vàng nhạt/đồng — điểm nhấn chính */
    --accent-2:    #7c8f6c;   /* xanh ô-liu dịu — thành công/AI/hành động */
    --warn:        #a97a3a;
    --err:         #ad5847;
    --user-bg:     #4f5f4c;   /* xanh rêu đậm cho bubble user */
    --radius-lg:   16px;
    --radius-md:   12px;
    --radius-sm:   9px;
    --shadow-1:    0 1px 2px rgba(61,56,46,0.06);
    --shadow-2:    0 6px 20px rgba(61,56,46,0.10);
  }

  /* ── Liquid Glass kiểu Apple (iOS 18 / visionOS): không phải chỉ frosted
     blur tĩnh — có 4 lớp làm nên cảm giác "kính lỏng nổi khối":
       1. Độ nổi 3D: shadow nhiều lớp (contact shadow sát + ambient shadow
          xa) thay vì 1 shadow phẳng, cộng highlight viền trên sáng hơn
          viền dưới (ánh sáng chiếu từ trên xuống).
       2. Specular sheen: 1 dải sáng chéo (::before) quét qua bề mặt khi
          hover/active — mô phỏng ánh sáng phản chiếu trên bề mặt kính
          khi "nghiêng" theo thao tác chạm, giống nút iOS.
       3. Chromatic refraction: kính thật không chỉ phản chiếu trắng —
          rìa dải sáng tán sắc rất nhẹ thành các vệt màu (đỏ/cam 1 bên,
          xanh/tím bên kia của sheen), đúng hiện tượng quang học khi ánh
          sáng đi qua bề mặt cong — đây là thứ làm liquid glass "có màu"
          dù nền vẫn be/kem, khác hẳn 1 lớp mờ trắng phẳng lì.
       4. Refraction "thở": sheen tự trôi rất chậm, rất mờ theo thời gian
          (idle) để bề mặt kính cảm giác "sống", có ánh sáng môi trường
          xung quanh liên tục đổi góc — không chỉ phản ứng khi chạm.
     Màu sắc chỉ xuất hiện ở rìa sheen, cường độ rất thấp — giữ tinh thần
     tinh tế, không lặp lại lỗi "viền cầu vồng đậm" của bản trước. */
  @keyframes glassIdleDrift {
    0%, 100% { background-position: 20% 50%; }
    50%      { background-position: 80% 50%; }
  }
  .glass {
    position: relative; isolation: isolate; overflow: hidden;
    background: rgba(255,254,251,0.55);
    backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.6) inset,
      0 -1px 1px rgba(61,56,46,0.05) inset,
      0 8px 20px rgba(61,56,46,0.08),
      0 1px 3px rgba(61,56,46,0.06);
    transition: box-shadow .35s cubic-bezier(.22,.7,.3,1), backdrop-filter .35s ease, transform .25s cubic-bezier(.22,.7,.3,1);
  }
  .glass::before {
    content: ""; position: absolute; inset: -60% -20%; z-index: 1;
    background: linear-gradient(115deg,
      transparent 26%,
      rgba(255,150,120,0.16) 42%,
      rgba(255,255,255,0.7) 49%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0.7) 51%,
      rgba(140,170,255,0.16) 58%,
      transparent 74%);
    transform: translateX(-120%) rotate(3deg);
    transition: transform .7s cubic-bezier(.22,.7,.3,1);
    pointer-events: none;
  }
  .glass::after {
    /* Ánh sáng môi trường trôi rất chậm, rất mờ — kính "sống" ngay cả khi
       không ai chạm vào, giống bề mặt liquid glass phản chiếu ánh sáng
       phòng liên tục đổi nhẹ. */
    content: ""; position: absolute; inset: 0; z-index: 0; border-radius: inherit;
    background: linear-gradient(100deg,
      rgba(255,180,150,0.05) 0%, transparent 25%,
      transparent 60%, rgba(150,180,255,0.05) 85%, transparent 100%);
    background-size: 220% 220%;
    animation: glassIdleDrift 9s ease-in-out infinite;
    pointer-events: none;
  }
  .glass:hover::before,
  .glass.glass-active::before { transform: translateX(20%) rotate(3deg); }
  .glass:active {
    transform: scale(0.985);
    backdrop-filter: blur(16px) saturate(1.7);
    -webkit-backdrop-filter: blur(16px) saturate(1.7);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.5) inset,
      0 -1px 2px rgba(61,56,46,0.08) inset,
      0 2px 6px rgba(61,56,46,0.10);
  }

  .glass-edge {
    position: relative; isolation: isolate; overflow: hidden;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 6px 16px rgba(61,56,46,0.06);
    transition: box-shadow .3s cubic-bezier(.22,.7,.3,1), transform .2s cubic-bezier(.22,.7,.3,1);
  }
  .glass-edge::after {
    content: "";
    position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    pointer-events: none;
  }
  .glass-edge::before {
    content: ""; position: absolute; inset: -60% -20%; z-index: 1;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255,150,120,0.13) 44%,
      rgba(255,255,255,0.6) 48%, rgba(255,255,255,0.72) 50%, rgba(255,255,255,0.6) 52%,
      rgba(140,170,255,0.13) 56%,
      transparent 70%);
    transform: translateX(-120%) rotate(3deg);
    transition: transform .7s cubic-bezier(.22,.7,.3,1);
    pointer-events: none;
  }
  .glass-edge:hover::before { transform: translateX(20%) rotate(3deg); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important; scroll-behavior:auto !important; }
  }

  html, body { margin:0; padding:0; background:var(--bg); height:100%; overflow:hidden; }
  * { box-sizing: border-box; }
  body { font-family:"Inter", -apple-system, "Segoe UI", sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100vh; height:100dvh; }

  #bar { flex:0 0 auto; background:rgba(238,233,221,0.7); backdrop-filter:blur(20px) saturate(1.3);
         -webkit-backdrop-filter:blur(20px) saturate(1.3); color:var(--text-dim);
         font-size:12px; font-weight:500; padding:12px 18px; display:flex;
         justify-content:space-between; align-items:center;
         border-bottom:1px solid var(--border-soft); box-shadow:0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 8px rgba(61,56,46,0.04);
         overflow:hidden; }
  #status { display:flex; align-items:center; gap:9px; flex:0 0 auto; min-width:0; }
  #statusText { color:var(--text); font-weight:600; letter-spacing:.15px; }
  @keyframes dotPulse {
    0%, 100% { box-shadow:0 0 0 3px rgba(124,143,108,0.16), 0 0 0 6px rgba(124,143,108,0.05); }
    50%      { box-shadow:0 0 0 5px rgba(124,143,108,0.10), 0 0 0 9px rgba(124,143,108,0.03); }
  }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--err); flex:0 0 auto;
         box-shadow:0 0 0 3px rgba(173,88,71,0.14); transition:background .3s ease, box-shadow .3s ease; }
  #dot.ok { background:var(--accent-2); animation: dotPulse 2.6s ease-in-out infinite; }
  #meta { color:var(--text-dim); letter-spacing:.2px; font-variant-numeric:tabular-nums; font-size:11.5px;
    flex:1 1 auto; min-width:0; margin-left:12px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; text-align:right; }

  /* ── /codeweb: layout 2 cột ────────────────────────────────────────────
     #mainSplit là flex row: #logScroll (tiến trình) bên trái, #codewebPane
     (live preview) bên phải. Mặc định #codewebPane ẩn (display:none) và
     #logScroll chiếm full-width — layout HỆT như trước khi có tính năng
     này. Chỉ khi session_meta.agent === "codeweb" (xem setCodewebMode() ở
     JS) mới thêm class "codeweb-on" vào #mainSplit để bật 2 cột — không
     đụng CSS/behaviour cũ cho mọi mode khác (build/plan). */
  #mainSplit { flex:1 1 auto; display:flex; flex-direction:row; min-height:0; overflow:hidden; }
  /* flex-grow cố định "0 1" ở CẢ 2 trạng thái (off dùng flex-basis:100%,
     on dùng 48%/55%) -- không đổi flex-grow giữa 2 trạng thái, cùng lý do
     đã sửa ở #codewebPane bên dưới (flex-grow đổi giá trị làm transition
     bị "che" mất, chỉ 1 chiều mượt còn chiều kia giật). */
  #logScroll { flex:0 1 100%; overflow-y:auto; -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
    transition:flex-basis .32s cubic-bezier(.22,.7,.3,1); }
  /* Trước đây #codewebPane display:none <-> flex là tức thì (không thể
     transition qua display:none). Giờ pane LUÔN nằm trong layout (display
     flex cố định), khi tắt co về width:0 + overflow:hidden (ẩn nội dung,
     không chiếm chỗ) -- cho phép "kéo ra nhả vô" mượt khi bật/tắt /codeweb.
     Dùng ĐÚNG easing cubic-bezier(.22,.7,.3,1) mà mọi animation khác trong
     file đang dùng (bubble, turn-toggle, card...) -- không tự chế curve.

     BUG ĐÃ SỬA: bản trước đổi flex-grow 0<->1 giữa 2 trạng thái (flex:0 0 0
     lúc tắt -> flex:1 1 52% lúc bật). flex-grow KHÔNG animate mượt qua CSS
     transition theo cách browser tính lại layout -- nó nhảy giá trị ngay
     lập tức rồi flexbox tính lại kích thước dựa trên khoảng trống còn lại
     trong CÙNG 1 bước, "che" mất transition của flex-basis/max-width. Do
     đó chiều off (1->0, không còn "cưỡng ép" chiếm chỗ) nhìn mượt còn chiều
     on (0->1, đột ngột giành hết chỗ trống) thì giật/không animate. Sửa:
     KHÔNG đổi flex-grow/shrink giữa 2 trạng thái nữa (giữ cố định "0 0"
     luôn), chỉ đổi flex-basis (0% <-> 52%) -- browser animate
     flex-basis mượt thật sự khi flex-grow không đổi ở cả 2 đầu. */
  #codewebPane { display:flex; flex:0 0 0%; overflow:hidden;
    flex-direction:column; background:#1e1e1e; position:relative;
    transition:flex-basis .32s cubic-bezier(.22,.7,.3,1); }
  #codewebPane > * { opacity:0; transition:opacity 180ms ease; }
  #mainSplit.codeweb-on #codewebPane > * { opacity:1; transition-delay:140ms; }
  /* Desktop dùng 48% log / 52% preview. Mobile được xếp dọc ở block
     responsive bên dưới để không ép text và preview thành hai cột hẹp. */
  #mainSplit.codeweb-on #logScroll { flex:0 1 48%; border-right:1px solid var(--border-soft); }
  #mainSplit.codeweb-on #codewebPane { flex:0 0 52%; }
  /* Thanh kéo giữa 2 cột -- ẩn hoàn toàn khi codeweb tắt (width:0, không
     chiếm chỗ, không bắt sự kiện). Khi bật: 1 dải mỏng có "grip" 3 chấm ở
     giữa để gợi ý kéo được. border-right của #logScroll bị tắt khi có
     resizer (resizer tự vẽ viền của chính nó) tránh đường viền đôi. */
  #codewebResizer { flex:0 0 0; width:0; overflow:hidden; position:relative;
    cursor:col-resize; touch-action:none; transition:width .32s cubic-bezier(.22,.7,.3,1), height .32s cubic-bezier(.22,.7,.3,1); }
  #mainSplit.codeweb-on #codewebResizer { flex:0 0 10px; width:10px; }
  #mainSplit.codeweb-on #logScroll { border-right:0; }
  #codewebResizer::before { content:""; position:absolute; inset:0; left:4px; width:1px;
    background:var(--border-soft); transition:background-color 120ms ease; }
  #codewebResizer:hover::before, #codewebResizer.cw-dragging::before { background:var(--accent-2); }
  #codewebResizerGrip { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:4px; height:28px; border-radius:3px; background:var(--border-soft);
    transition:background-color 120ms ease, height 120ms ease; }
  #codewebResizer:hover #codewebResizerGrip, #codewebResizer.cw-dragging #codewebResizerGrip {
    background:var(--accent-2); height:40px; }
  /* Lúc đang kéo: tắt transition của 2 cột (phải theo sát con trỏ ngay lập
     tức, easing 320ms sẽ làm trễ và giật) + tắt transition mượt của bubble/
     iframe bên trong để không "đua" theo kích thước đổi liên tục mỗi pixel. */
  #mainSplit.cw-resizing #logScroll, #mainSplit.cw-resizing #codewebPane { transition:none; }
  #mainSplit.cw-resizing { cursor:col-resize; user-select:none; }
  #mainSplit.cw-resizing #codewebFrame { pointer-events:none; }

  /* Mobile: xếp chat trên / preview dưới để mỗi pane dùng trọn chiều
     ngang. Resizer vẫn giữ, chỉ đổi từ kéo trái-phải sang lên-xuống. */
  @media (max-width:520px) {
    #mainSplit.codeweb-on { flex-direction:column; }
    #mainSplit.codeweb-on #logScroll { flex:0 1 58%; width:100%; }
    #mainSplit.codeweb-on #codewebPane { flex:0 0 42%; width:100%; }
    #mainSplit.codeweb-on #codewebResizer {
      flex:0 0 8px; width:100%; height:8px; cursor:row-resize;
    }
    #codewebResizer::before { left:0; top:3px; width:100%; height:1px; }
    #codewebResizerGrip { width:28px; height:4px; }
    #codewebResizer:hover #codewebResizerGrip,
    #codewebResizer.cw-dragging #codewebResizerGrip { width:40px; height:4px; }
    #mainSplit.cw-resizing { cursor:row-resize; }
  }



  /* ── /codeweb: luồng hội thoại phẳng kiểu Claude ─────────────────────
     Chỉ đổi hierarchy/spacing trong codeweb: text AI không bọc trong card lớn,
     user vẫn là bubble, tool detail vẫn mở/đóng và live-slot nổi vẫn giữ
     nguyên. Mode build/plan không bị ảnh hưởng. */
  #mainSplit.codeweb-on #log {
    padding:14px clamp(12px, 3.5vw, 28px) 24px; gap:0;
    font-size:14px; line-height:1.58;
  }
  #mainSplit.codeweb-on .bubble-wrap.from-ai {
    justify-content:flex-start; margin:12px 0 2px;
  }
  #mainSplit.codeweb-on .bubble-wrap.from-user {
    justify-content:flex-end; margin:10px 0 16px;
  }
  #mainSplit.codeweb-on .bubble {
    backdrop-filter:none; -webkit-backdrop-filter:none; animation:none;
  }
  #mainSplit.codeweb-on .bubble::before { display:none; }
  #mainSplit.codeweb-on .bubble.ai {
    width:100%; max-width:100%; overflow:visible; padding:5px 0;
    background:transparent; border:0; border-radius:0; box-shadow:none;
    font-size:14.5px; line-height:1.62;
  }
  #mainSplit.codeweb-on .bubble.ai.glass-edge::before,
  #mainSplit.codeweb-on .bubble.ai.glass-edge::after { display:none; }
  #mainSplit.codeweb-on .bubble.user {
    width:auto; max-width:88%; padding:9px 13px;
    border-radius:16px 16px 4px 16px; font-size:13.5px; line-height:1.5;
  }
  #mainSplit.codeweb-on .bubble:active { transform:none; }

  #mainSplit.codeweb-on .turn-toggle-row { margin:1px 0 10px; }
  #mainSplit.codeweb-on .turn-toggle {
    gap:5px; padding:5px 2px; border:0; border-radius:7px;
    background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none;
    box-shadow:none; color:var(--text-dim); font-size:12px;
  }
  #mainSplit.codeweb-on .turn-toggle:hover,
  #mainSplit.codeweb-on .turn-toggle.open { background:rgba(124,143,108,0.08); box-shadow:none; }
  #mainSplit.codeweb-on .turn-toggle .tool-count {
    order:1; padding:0; background:transparent; color:inherit; font-size:12px;
  }
  #mainSplit.codeweb-on .turn-toggle .label { order:2; font-weight:500; }
  #mainSplit.codeweb-on .turn-toggle .chev { order:3; transform:rotate(0deg); }
  #mainSplit.codeweb-on .turn-toggle.open .chev { transform:rotate(90deg); }
  #mainSplit.codeweb-on .turn-logs { margin:0 0 12px; }
  #mainSplit.codeweb-on .turn-logs-inner {
    padding:7px; border-radius:10px; gap:6px;
    backdrop-filter:none; -webkit-backdrop-filter:none;
    background:rgba(255,254,251,0.5); border-color:var(--border-soft);
  }
  #mainSplit.codeweb-on .tool-group { margin:0; padding:8px 9px 8px 0; box-shadow:none; }
  #mainSplit.codeweb-on .tool-group-head { padding:0 9px 6px 11px; gap:6px; }
  #mainSplit.codeweb-on .tool-children { display:block; margin-left:10px; padding-left:12px; }
  #mainSplit.codeweb-on .tool-child { padding:4px 7px 4px 6px; font-size:11.5px; }
  #mainSplit.codeweb-on .bubble-img-thumb { width:56px; height:56px; }

  #codewebToolbar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:6px; padding:6px 8px; background:rgba(238,233,221,0.7); border-bottom:1px solid var(--border-soft); }
  /* Tên file dài (vd "vietnam-intro-page-final-v2.html") không giới hạn
     trước đây khiến 1 tab giãn hết cỡ, đẩy các tab khác ra ngoài mà không
     có dấu hiệu gì báo còn tab bị che ngoài overflow-x:auto trần trụi.
     Giờ: mỗi tab max-width + ellipsis, và gradient fade mờ dần ở 2 đầu
     thanh tab (luôn hiện, không cần JS phát hiện scroll position — đơn
     giản, đủ dùng vì đây chỉ là gợi ý thị giác "có thể còn thứ để cuộn"). */
  #codewebTabs { flex:1 1 auto; display:flex; gap:4px; overflow-x:auto; min-width:0;
    position:relative;
    mask-image:linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
  #codewebTabs .cw-tab { font-size:12px; padding:4px 10px; border-radius:999px; white-space:nowrap;
    max-width:140px; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto;
    background:rgba(255,254,251,0.8); border:1px solid var(--border-soft); color:var(--text-dim); cursor:pointer;
    transition:background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
  #codewebTabs .cw-tab.active { background:var(--accent-2); color:#fff; border-color:var(--accent-2); }
  #codewebToolbarBtns { flex:0 0 auto; display:flex; gap:4px; }
  #codewebToolbarBtns button { width:26px; height:26px; border-radius:6px; border:1px solid var(--border-soft);
    background:rgba(255,254,251,0.8); color:var(--text-dim); cursor:pointer; font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; }
  #codewebToolbarBtns button:hover { background:var(--accent-2); color:#fff; border-color:var(--accent-2); }
  /* Mobile không có :hover thật (chỉ tap) -> :active cho phản hồi ngay lúc
     chạm, không phải chờ nhấc tay ra mới thấy đổi màu qua :hover giả lập. */
  #codewebToolbarBtns button:active { background:var(--accent-2); color:#fff; border-color:var(--accent-2); transform:scale(.92); }
  #codewebReloadBtn.cw-spinning { animation:cwSpin 700ms linear infinite; }
  @keyframes cwSpin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

  /* Panel cài đặt (chọn tỉ lệ khung) -- popover nhỏ góc phải trên, ẩn mặc
     định, chỉ hiện khi bấm nút ⚙ (JS toggle class "show"). CHỈ tồn tại
     trong codeweb — không ảnh hưởng UI mode khác. */
  #codewebSettingsPanel { display:none; position:absolute; top:40px; right:8px; z-index:20;
    background:#fff; border:1px solid var(--border-soft); border-radius:10px; padding:10px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18); min-width:180px; }
  #codewebSettingsPanel.show { display:block; }
  .cw-settings-title { font-size:11px; color:var(--text-dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px; }
  #codewebRatioOptions { display:flex; flex-wrap:wrap; gap:6px; }
  #codewebRatioOptions button { font-size:12px; padding:5px 9px; border-radius:6px;
    border:1px solid var(--border-soft); background:rgba(0,0,0,0.03); color:var(--text-dim); cursor:pointer; }
  #codewebRatioOptions button:hover { background:rgba(0,0,0,0.06); }
  #codewebRatioOptions button:active { background:rgba(0,0,0,0.1); transform:scale(.95); }
  #codewebRatioOptions button.active { background:var(--accent-2); color:#fff; border-color:var(--accent-2); }

  /* Wrapper giữ khung tỉ lệ đã chọn -- khi ratio != "none", iframe co lại
     đúng aspect-ratio, canh giữa, phần thừa xung quanh là nền tối (giống
     khung xem responsive thật). ratio="none" -> full kích thước pane như cũ. */
  #codewebFrameWrap { flex:1 1 auto; display:flex; align-items:center; justify-content:center;
    overflow:auto; background:#1e1e1e; min-height:0; position:relative; }
  /* KHÔNG dùng CSS aspect-ratio + max-width/max-height cùng lúc: 2 cơ chế
     này không phối hợp đúng khi bị giới hạn theo chiều rộng (16:9, 20:9 bị
     max-width chặn nhưng height không tự co theo -- đã kiểm chứng bằng
     Playwright). Thay vào đó JS đo clientWidth/clientHeight của wrap rồi
     TÍNH TRỰC TIẾP width/height px chính xác theo ratio, set inline style.
     CSS ở đây chỉ còn việc trang trí (box-shadow), không tự quyết định size. */
  #codewebFrameWrap.cw-has-ratio #codewebFrame { box-shadow:0 0 0 1px rgba(255,255,255,0.08); }
  /* Trước đây chuyển ẩn<->hiện giữa #codewebEmpty và #codewebFrame bằng
     display:none (tức thì, không mượt) trong khi mọi hiệu ứng khác trong
     file đều có transition -> không đồng bộ phong cách. Giờ cả 2 luôn nằm
     trong DOM, fade qua opacity+scale nhẹ; lớp không active thêm
     pointer-events:none để không chặn click/tap của lớp đang hiện. */
  #codewebFrame { flex:1 1 auto; width:100%; height:100%; border:0; background:#fff;
    opacity:0; transform:scale(.98); transition:opacity 220ms ease, transform 220ms ease; pointer-events:none; }
  #codewebFrameWrap.cw-has-ratio #codewebFrame { flex:none; }
  /* Animation trượt ngang khi auto-preview/preview_check đổi sang 1 tab
     khác — chạy lại mỗi lần class được thêm (JS force-reflow trước khi add). */
  @keyframes cwSlideIn { from { transform:translateX(24px); opacity:0; } to { transform:translateX(0); opacity:1; } }
  #codewebFrame.cw-slide-in { animation:cwSlideIn 220ms ease-out; }
  #codewebPane.has-preview #codewebFrame { opacity:1; transform:scale(1); pointer-events:auto; }
  #codewebPane.has-preview #codewebEmpty { opacity:0; pointer-events:none; }
  #codewebEmpty { flex:1 1 auto; display:flex; align-items:center; justify-content:center;
    color:#8a8a8a; font-size:13px; text-align:center; padding:24px;
    position:absolute; inset:0; opacity:1; transition:opacity 220ms ease; }


  #log { padding:16px 12px; display:flex; flex-direction:column; gap:10px; min-width:0;
    font-size: 14.5px; line-height:1.6; color:var(--text); min-height:100%; }

  /* Xuất hiện nhẹ nhàng: fade + trượt lên rất ít, không overshoot, để cảm
     giác "điềm tĩnh" thay vì nảy. */
  @keyframes rowIn {
    from { opacity:0; transform: translateY(6px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .row, .info-card, .tool-group, .ask-box, .turn-toggle-row {
    animation: rowIn .28s cubic-bezier(.22,.7,.3,1) both;
    will-change: transform, opacity;
  }
  .row { white-space:pre-wrap; word-break:break-word; }
  .dim { color:var(--text-dim); }
  .mono { font-family:"JetBrains Mono", Menlo, Consolas, monospace; font-size:12.5px; }

  /* ── Spinner "Thinking" — con trỏ nhấp nháy cuối bubble AI khi streaming */
  @keyframes caretBlink { 0%, 45% { opacity:1; } 50%, 95% { opacity:0; } 100% { opacity:1; } }
  .ai-body.streaming::after {
    content:""; display:inline-block; width:2px; height:1em; margin-left:2px;
    background:var(--accent); vertical-align:-2px;
    animation: caretBlink 1s steps(1) infinite;
  }

  .spinner-row { display:flex; align-items:center; gap:0; font-family:"JetBrains Mono",monospace; }
  .spinner-frame { color:var(--accent); display:inline-block; width:1ch; text-align:center; }
  .spinner-label { color:var(--accent); margin-left:6px; font-family:"Inter",sans-serif; font-weight:600; }
  .spinner-rain  { color:var(--text-dim); margin-left:8px; letter-spacing:1px; }
  .spinner-time  { color:var(--text-dim); margin-left:8px; }

  /* ── Bong bóng chat: user phải / AI trái. Bay vào từ hướng tương ứng +
     phóng to nhẹ từ 0.85 -> 1.03 -> 1 (overshoot rồi ổn định), giống hiệu
     ứng "pop" của iMessage khi tin nhắn xuất hiện — rõ ràng, có sức sống,
     nhưng vẫn gọn (250ms) không gây rối mắt khi tin nhắn đến dồn dập. */
  @keyframes bubbleInUser {
    0%   { opacity:0; transform: translateX(24px) scale(0.85); }
    60%  { opacity:1; transform: translateX(-2px) scale(1.03); }
    100% { opacity:1; transform: translateX(0) scale(1); }
  }
  @keyframes bubbleInAi {
    0%   { opacity:0; transform: translateX(-24px) scale(0.85); }
    60%  { opacity:1; transform: translateX(2px) scale(1.03); }
    100% { opacity:1; transform: translateX(0) scale(1); }
  }
  .bubble-wrap { display:flex; width:100%; }
  .bubble-wrap.from-user { justify-content:flex-end; }
  .bubble-wrap.from-ai   { justify-content:flex-start; }
  .bubble-wrap.from-user .bubble { transform-origin: right center; animation: bubbleInUser .42s cubic-bezier(.25,.85,.35,1.15) both; will-change: transform, opacity; }
  .bubble-wrap.from-ai   .bubble { transform-origin: left center;  animation: bubbleInAi   .42s cubic-bezier(.25,.85,.35,1.15) both; will-change: transform, opacity; }
  .bubble {
    position: relative; isolation: isolate; overflow: hidden;
    max-width: 86%; border-radius:var(--radius-lg); padding:12px 16px;
    white-space:pre-wrap; word-break:break-word;
    transition: box-shadow .3s cubic-bezier(.22,.7,.3,1), transform .18s cubic-bezier(.22,.7,.3,1), backdrop-filter .3s ease;
  }
  /* Sheen quét chéo qua bubble — nhịp "nhanh – chậm (giữa) – nhanh": vì
     @keyframes chạy trên timeline ĐỀU theo % thời gian, muốn có tốc độ
     khác nhau ở từng đoạn thì phải đặt các mốc VỊ TRÍ không cách đều nhau
     theo % thời gian tương ứng — đoạn nào cần "chậm" thì quãng đường di
     chuyển giữa 2 mốc % gần nhau phải NGẮN, đoạn "nhanh" thì quãng đường
     giữa 2 mốc % gần nhau phải DÀI. Ở đây: 0%→25% (nhanh, đi được 60%
     quãng đường: -140%→-20%), 25%→65% (chậm, chỉ đi thêm 20%: -20%→0%,
     nằm khựng gần giữa khung để mắt kịp thấy ánh sáng), 65%→100% (nhanh
     lại, thoát hẳn ra ngoài: 0%→150%). Tổng thời lượng kéo dài hơn bản cũ
     để 3 nhịp đủ rõ ràng, không bị "lướt qua" như 1 pha đơn. */
  @keyframes bubbleSheenSweep {
    0%   { transform: translateX(-140%) rotate(3deg); opacity: 0; }
    8%   { opacity: 1; }
    25%  { transform: translateX(-20%)  rotate(3deg); }
    65%  { transform: translateX(4%)    rotate(3deg); opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateX(150%) rotate(3deg); opacity: 0; }
  }
  .bubble::before {
    content: ""; position: absolute; inset: -60% -20%; z-index: 1;
    background: linear-gradient(115deg,
      transparent 28%,
      rgba(255,150,120,0.16) 43%,
      rgba(255,255,255,0.55) 48%, rgba(255,255,255,0.72) 50%, rgba(255,255,255,0.55) 52%,
      rgba(140,170,255,0.16) 57%,
      transparent 72%);
    opacity: 0;
    animation: bubbleSheenSweep 1.5s linear .15s 1 forwards;
    pointer-events: none;
  }
  /* Chạm/tap: quét lại cùng nhịp 3 pha, nhanh hơn 1 chút cho phản hồi tức
     thời (500ms rút gọn tỷ lệ, giữ nguyên hình dạng nhịp qua %). */
  .bubble:active::before {
    animation: bubbleSheenSweep .9s linear 0s 1 forwards;
  }
  /* Link trong bubble chat (chèn bởi linkifyHtml()) -- bôi màu accent xanh
     rêu (đồng bộ tông màu app, không lạc quẻ với bubble user/ai), gạch chân
     nhẹ để phân biệt rõ với text thường, đổi độ đậm khi hover/tap để có
     phản hồi (mobile không có :hover thật nên thêm :active cùng kiểu). */
  a.cw-chat-link { color:var(--accent-2); text-decoration:underline; text-decoration-thickness:1px;
    text-underline-offset:2px; word-break:break-all; }
  a.cw-chat-link:hover, a.cw-chat-link:active { opacity:0.75; }
  .bubble.user a.cw-chat-link { color:#fbfaf5; text-decoration-color:rgba(255,255,255,0.65); }

  .bubble.user {
    background: linear-gradient(165deg, rgba(107,130,100,0.62), rgba(79,95,76,0.68));
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    color:#fbfaf5; border:1px solid rgba(255,255,255,0.22);
    border-bottom-right-radius:4px;
    /* Shadow "đèn mờ" 3D: 1) highlight viền trên (ánh sáng hắt từ trên),
       2) contact shadow rất sát & mềm (bubble "chạm" nền), 3) ambient
       shadow xa lan toả rất nhạt màu xanh rêu của chính bubble (không
       phải xám trung tính) -- đây là thứ tạo cảm giác "nổi khối sang"
       thay vì shadow đen phẳng thông thường. */
    box-shadow:
      0 1px 0 rgba(255,255,255,0.22) inset,
      0 -6px 14px rgba(0,0,0,0.12) inset,
      0 2px 4px rgba(61,56,46,0.10),
      0 10px 22px -6px rgba(79,95,76,0.32),
      0 22px 40px -14px rgba(79,95,76,0.22);
  }
  .bubble.ai   {
    background: rgba(255,254,251,0.5);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    color:var(--text); border:1px solid rgba(255,255,255,0.6);
    border-bottom-left-radius:4px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.75) inset,
      0 -4px 10px rgba(61,56,46,0.03) inset,
      0 2px 4px rgba(61,56,46,0.05),
      0 10px 22px -8px rgba(61,56,46,0.14),
      0 22px 38px -16px rgba(176,138,78,0.14);
  }
  .bubble:active {
    transform: scale(0.985);
  }
  .bubble.user:active {
    backdrop-filter: blur(13px) saturate(1.8);
    -webkit-backdrop-filter: blur(13px) saturate(1.8);
  }
  .bubble.ai:active {
    backdrop-filter: blur(14px) saturate(1.8);
    -webkit-backdrop-filter: blur(14px) saturate(1.8);
  }

  /* ── Nhóm tool (cha-con) ─────────────────────────────────────────── */
  .tool-group {
    background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    padding:10px 12px 10px 0; margin:0 4px; position:relative; overflow:hidden; min-width:0;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 4px 12px rgba(61,56,46,0.06),
      -3px 0 0 0 var(--accent) inset;
    transition: box-shadow .25s cubic-bezier(.22,.7,.3,1);
  }
  .tool-group-head {
    display:flex; align-items:baseline; gap:8px; padding:0 12px 8px 14px;
    font-weight:600; min-width:0;
  }
  .tool-group-head .tool-icon { font-size:13px; opacity:.75; flex-shrink:0; }
  .tool-group-head .tool-name { color:var(--text); flex-shrink:0; white-space:nowrap; }
  .tool-group-head .tool-brief { color:var(--text-dim); font-weight:400; font-size:12.5px; white-space:pre-wrap; word-break:break-word; min-width:0; flex:1 1 auto; }
  .tool-arg-chip {
    background:var(--bg-sunken); border-radius:6px; padding:1px 6px;
    display:inline-block; max-width:100%;
    white-space:pre-wrap; word-break:break-word; vertical-align:bottom;
  }
  .tool-group.denied { border-color:#ddbcb0; background:#fbf2ee;
    box-shadow:var(--shadow-1), -3px 0 0 0 var(--err) inset; }

  .tool-children { position:relative; margin-left:14px; padding-left:16px; min-width:0; }
  .tool-children::before {
    content:""; position:absolute; left:0; top:2px; bottom:8px; width:1.5px;
    background:var(--border); border-radius:2px;
  }
  .tool-child {
    position:relative; padding:5px 10px 5px 8px; color:var(--text-dim);
    font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
  }
  .tool-child::before {
    content:""; position:absolute; left:-16px; top:12px; width:12px; height:1.5px;
    background:var(--border);
  }
  .tool-child.child-info { color:var(--text); background:var(--bg-sunken);
    border-radius:var(--radius-sm); margin:2px 8px 2px 0; padding:8px 10px 8px 8px; }
  .tool-child.child-warn { color:var(--warn); }
  .tool-child.child-err  { color:var(--err); }
  .tool-child.child-denied { color:var(--err); font-weight:500; }

  /* ── info-card độc lập */
  .info-card {
    background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    padding:11px 14px; margin:0 4px; color:var(--text); box-shadow:var(--shadow-1);
  }
  .info-card.raw-info { font-family:"JetBrains Mono",monospace; font-size:12.5px; background:var(--bg-sunken); }
  .info-card.warn { border-color:#dcc190; background:#f9f1e0; color:#7d5a24; box-shadow:var(--shadow-1); }
  .info-card.err  { border-color:#ddb2a5; background:#fbf1ed; color:#833a2a; box-shadow:var(--shadow-1); }
  .info-card.step { background:transparent; border:none; box-shadow:none; padding:2px 13px; color:var(--text-dim);
    font-family:"JetBrains Mono",monospace; font-size:12px; }
  .info-card.think {
    background:var(--bg-sunken); border:1px solid var(--border-soft);
    border-radius:var(--radius-lg); box-shadow:var(--shadow-1);
    color:var(--text-dim); font-style:italic;
    border-left:3px solid var(--border);
  }
  .info-card.think .think-label {
    font-style:normal; font-weight:600; color:var(--accent);
    font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.3px;
  }
  .info-card.think .think-body { white-space:pre-wrap; }

  .ask-box { border:1px solid #dcc190; background:#f9f1e0; border-radius:var(--radius-md);
             padding:13px 15px; margin:0 4px;
             box-shadow:var(--shadow-2);
             transition: opacity .35s ease, filter .35s ease, box-shadow .35s ease, transform .35s ease; }
  .ask-prompt { color:#7d5a24; margin-bottom:9px; white-space:pre-wrap; font-weight:500; }
  .ask-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .ask-btn {
    position: relative; isolation: isolate; overflow: hidden;
    background:var(--bg-panel); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:9px 16px; font-size:13px; font-weight:600;
    cursor:pointer;
    box-shadow: 0 1px 1px rgba(255,255,255,0.7) inset, 0 2px 6px rgba(61,56,46,0.07);
    transition:transform .15s cubic-bezier(.3,1.3,.5,1), box-shadow .2s cubic-bezier(.22,.7,.3,1);
  }
  .ask-btn::before {
    content: ""; position: absolute; inset: -70% -10%; z-index: 1;
    background: linear-gradient(115deg,
      transparent 32%, rgba(255,255,255,0.55) 48%, rgba(255,255,255,0.7) 50%,
      rgba(255,255,255,0.55) 52%, transparent 68%);
    transform: translateX(-140%) rotate(6deg);
    transition: transform .5s cubic-bezier(.22,.7,.3,1);
    pointer-events: none;
  }
  .ask-btn:hover::before { transform: translateX(30%) rotate(6deg); }
  .ask-btn:active { transform:scale(0.96) translateY(1px);
    box-shadow: 0 1px 1px rgba(255,255,255,0.5) inset, 0 1px 2px rgba(61,56,46,0.08); }
  .ask-btn.yes { background:linear-gradient(160deg, #92a682, var(--accent-2)); border-color:var(--accent-2); color:#fff;
    box-shadow: 0 1px 1px rgba(255,255,255,0.35) inset, 0 -2px 5px rgba(0,0,0,0.1) inset, 0 3px 10px rgba(124,143,108,0.35); }
  .ask-btn.no  { background:linear-gradient(160deg, #c17e6d, var(--err)); border-color:var(--err); color:#fff;
    box-shadow: 0 1px 1px rgba(255,255,255,0.35) inset, 0 -2px 5px rgba(0,0,0,0.1) inset, 0 3px 10px rgba(173,88,71,0.3); }
  .ask-input { display:flex; gap:8px; margin-top:9px; }
  .ask-input input { flex:1; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-sm);
                      color:var(--text); padding:9px 11px; font-size:14px; font-family:inherit; }
  .ask-input button { background:var(--accent-2); color:#fff; border:none; border-radius:var(--radius-sm);
                       padding:9px 17px; font-weight:600; font-size:13px; cursor:pointer;
                       box-shadow:0 2px 8px rgba(124,143,108,0.3); transition:transform .08s; }
  .ask-input button:active { transform:translateY(1px); }
  .ask-answered .ask-input,
  .ask-answered .ask-actions { display:none; }
  .ask-answered {
    opacity: 0.42;
    filter: saturate(0.65);
    box-shadow: var(--shadow-1);
    pointer-events: none;
  }
  .ask-answered .ask-btn,
  .ask-answered .ask-input button { cursor: default; }
  .ask-answer-tag {
    display:flex; align-items:center; gap:6px; margin:6px 8px 0;
    font-weight:600; color:var(--accent-2); font-size:13px;
    animation: rowIn .28s cubic-bezier(.22,.7,.3,1) both;
  }
  @keyframes askBoxOut {
    from { opacity:1; transform: scale(1) translateY(0); max-height:400px; margin-bottom:0; }
    to   { opacity:0; transform: scale(0.95) translateY(-4px); max-height:0; margin-bottom:-8px; }
  }
  .ask-box-leaving {
    animation: askBoxOut .3s cubic-bezier(.4,0,.2,1) both;
    overflow:hidden; pointer-events:none;
  }
  @keyframes modelItemIn {
    from { opacity:0; transform: translateY(4px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .model-picker-item {
    animation: modelItemIn .24s cubic-bezier(.22,.7,.3,1) both;
    animation-delay: calc(var(--i, 0) * 28ms);
  }
  @keyframes pickerPageInNext {
    from { opacity:0; transform: translateX(10px); }
    to   { opacity:1; transform: translateX(0); }
  }
  @keyframes pickerPageInPrev {
    from { opacity:0; transform: translateX(-10px); }
    to   { opacity:1; transform: translateX(0); }
  }
  .model-picker-list.picker-page-next { animation: pickerPageInNext .24s cubic-bezier(.22,.7,.3,1) both; }
  .model-picker-list.picker-page-prev { animation: pickerPageInPrev .24s cubic-bezier(.22,.7,.3,1) both; }

  .model-picker { margin-top:6px; }
  .model-picker-search input {
    width:100%; box-sizing:border-box; background:var(--bg-panel);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    color:var(--text); padding:9px 11px; font-size:14px; font-family:inherit;
    margin-bottom:8px;
  }
  .model-picker-list {
    display:flex; flex-direction:column; gap:4px;
    max-height:280px; overflow-y:auto;
  }
  .model-picker-empty {
    color:var(--text-dim); font-size:13px; padding:10px 4px; text-align:center;
  }
  .model-picker-item {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:9px 12px; font-size:13.5px;
    font-family:"JetBrains Mono",monospace; color:var(--text);
    cursor:pointer; text-align:left; width:100%; box-sizing:border-box;
    transition:transform .08s, box-shadow .08s, background .12s;
  }
  .model-picker-item:hover { background:var(--bg-sunken); }
  .model-picker-item:active { transform:translateY(1px); }
  .model-picker-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .model-picker-badge { flex:0 0 auto; }
  .model-picker-pager {
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-top:8px;
  }
  .model-picker-page-btn {
    background:var(--accent-2); color:#fff; border:none; border-radius:var(--radius-sm);
    padding:7px 14px; font-weight:600; font-size:12.5px; cursor:pointer;
    box-shadow:0 2px 8px rgba(124,143,108,0.3); transition:transform .08s, opacity .08s;
  }
  .model-picker-page-btn:active { transform:translateY(1px); }
  .model-picker-page-btn:disabled {
    opacity:0.35; cursor:default; box-shadow:none;
  }
  .model-picker-page-info { color:var(--text-dim); font-size:12px; text-align:center; flex:1; }
  .ask-answer-tag::before { content:"✓"; }

  #inputBar { flex:0 0 auto; display:flex; align-items:center; gap:8px;
              background:rgba(238,233,221,0.78); backdrop-filter:blur(16px) saturate(1.2);
              -webkit-backdrop-filter:blur(16px) saturate(1.2);
              border-top:1px solid var(--border-soft); box-shadow:0 -2px 10px rgba(61,56,46,0.04);
              padding:10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); position:relative; }
  #inputField {
    flex:1 1 auto; min-width:0; background:var(--bg-panel); border:1px solid var(--border-soft);
    border-radius:999px; outline:none; color:var(--text); font-family:inherit; font-size:15px;
    padding:12px 18px; height:46px;
    box-shadow:inset 0 1px 2px rgba(61,56,46,0.05); transition:border-color .15s, box-shadow .15s;
  }
  #inputField:focus { border-color:var(--accent); box-shadow:inset 0 1px 2px rgba(61,56,46,0.05), 0 0 0 3px rgba(176,138,78,0.14); }
  #inputField:disabled {
    background:var(--bg-sunken); color:var(--text-dim);
    border-color:var(--border-soft); box-shadow:none; cursor:not-allowed;
  }
  /* ── Nút tròn liquid-glass: nổi khối rõ (highlight trên + shadow đổ dưới
     kiểu "viên kẹo kính" của iOS), kèm dải sáng quét chéo khi chạm/hover —
     mô phỏng ánh sáng trượt qua bề mặt kính lồi khi ngón tay lướt qua. */
  #sendBtn, #ctrlBtn, #imgBtn {
    position: relative; isolation: isolate; overflow: hidden;
    flex:0 0 auto; width:46px; height:46px; border:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700; cursor:pointer; padding:0;
    transition:transform .18s cubic-bezier(.3,1.4,.5,1), box-shadow .25s cubic-bezier(.22,.7,.3,1), filter .12s;
  }
  #sendBtn::before, #ctrlBtn::before, #imgBtn::before {
    content: ""; position: absolute; inset: -70% -10%; z-index: 2;
    background: linear-gradient(115deg,
      transparent 26%,
      rgba(255,150,120,0.22) 40%,
      rgba(255,255,255,0.65) 47%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.65) 53%,
      rgba(140,170,255,0.22) 60%,
      transparent 74%);
    transform: translateX(-140%) rotate(8deg);
    transition: transform .55s cubic-bezier(.22,.7,.3,1);
    pointer-events: none;
  }
  #sendBtn:hover::before, #ctrlBtn:hover::before, #imgBtn:hover::before { transform: translateX(30%) rotate(8deg); }
  #sendBtn:active, #ctrlBtn:active, #imgBtn:active { transform:scale(0.9); filter:brightness(0.98); }
  #sendBtn:active::before, #ctrlBtn:active::before, #imgBtn:active::before { transform: translateX(60%) rotate(8deg); }
  #sendBtn { background:linear-gradient(160deg, #8ba07a, var(--accent-2) 55%, #5c7050); color:#fff;
    box-shadow:
      0 1px 1px rgba(255,255,255,0.4) inset,
      0 -3px 6px rgba(0,0,0,0.14) inset,
      0 5px 14px rgba(124,143,108,0.4),
      0 2px 4px rgba(61,56,46,0.12); }
  #sendBtn:active { box-shadow:
      0 1px 1px rgba(255,255,255,0.3) inset,
      0 -2px 5px rgba(0,0,0,0.18) inset,
      0 2px 6px rgba(124,143,108,0.35); }
  #sendBtn:disabled { background:var(--border-soft); color:var(--text-dim); cursor:not-allowed;
    box-shadow:none; }
  /* ── Nút chọn ảnh: khung tròn 46x46 + hiệu ứng ánh sáng quét chéo dùng
     CHUNG với #sendBtn/#ctrlBtn (khai báo gộp ở rule phía trên). Ở đây chỉ
     còn phần MÀU/VIỀN riêng: tông trắng-xanh nhạt trung tính để không lẫn
     với sendBtn (xanh lá) hay ctrlBtn (đỏ). Trước khi sửa, #imgBtn đứng
     riêng lẻ, không có border-radius:50%/width/height/hiệu ứng hover -- nút
     bị méo/vuông, không đồng bộ hình khối với 2 nút còn lại trong inputBar.
     CHỈ hiện khi đang chạy qua /web (luôn đúng vì web_index.html chỉ được
     serve bởi 12_web.py) -- không có khái niệm "CLI mode" trong file này. */
  #imgBtn { background:rgba(255,254,251,0.8); color:var(--accent-2); border:1.5px solid var(--border-soft);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.8) inset,
      0 3px 8px rgba(61,56,46,0.08); }
  #imgBtn:hover { background:rgba(139,160,122,0.1); }
  #imgBtn:disabled { opacity:0.35; cursor:not-allowed; filter:grayscale(1); box-shadow:none; }
  #imgBtn.has-images { color:#fff; background:linear-gradient(160deg, #8ba07a, var(--accent-2) 55%, #5c7050); }
  #imgInput { display:none; }

  /* ── Thanh preview ảnh đã chọn, nằm trên #inputBar, chỉ hiện khi có ảnh */
  #imgPreviewBar {
    display:none; flex:0 0 auto; gap:8px; padding:8px 10px 0;
    background:rgba(238,233,221,0.78); backdrop-filter:blur(16px) saturate(1.2);
    -webkit-backdrop-filter:blur(16px) saturate(1.2);
  }
  #imgPreviewBar.show { display:flex; flex-wrap:wrap; }
  .img-thumb { position:relative; width:52px; height:52px; border-radius:10px; overflow:hidden;
    border:1px solid var(--border-soft); flex:0 0 auto; }
  .img-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .img-thumb .rm { position:absolute; top:1px; right:1px; width:16px; height:16px; border-radius:50%;
    background:rgba(40,36,30,0.72); color:#fff; border:none; font-size:11px; line-height:16px;
    cursor:pointer; padding:0; }

  /* ── Popup "model không hỗ trợ ảnh" ─────────────────────────────────── */
  #visionModal {
    display:none; position:fixed; inset:0; z-index:50; align-items:center; justify-content:center;
    background:rgba(40,36,30,0.4); backdrop-filter:blur(3px);
  }
  #visionModal.show { display:flex; }
  #visionModalCard {
    background:var(--bg-panel); border-radius:var(--radius-md); padding:20px 22px; max-width:320px;
    box-shadow:0 12px 40px rgba(61,56,46,0.28); text-align:center;
  }
  #visionModalCard h3 { margin:0 0 8px; font-size:15px; color:var(--text); }
  #visionModalCard p { margin:0 0 16px; font-size:13px; color:var(--text-dim); line-height:1.5; }
  #visionModalCard button { background:var(--accent-2); color:#fff; border:none; border-radius:var(--radius-sm);
    padding:9px 20px; font-weight:600; font-size:13px; cursor:pointer; }

  .bubble-img-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .bubble-img-thumb { width:96px; height:96px; object-fit:cover; border-radius:10px;
    border:1px solid var(--border-soft); display:block; }
  #ctrlBtn { background:rgba(255,254,251,0.8); color:var(--err); border:1.5px solid rgba(173,88,71,0.3);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.8) inset,
      0 3px 8px rgba(61,56,46,0.08),
      0 1px 2px rgba(61,56,46,0.05);
    font-size:12px; }
  #ctrlBtn:hover { background:rgba(173,88,71,0.08); }
  #ctrlBtn:active { box-shadow:
      0 1px 1px rgba(255,255,255,0.6) inset,
      0 1px 3px rgba(61,56,46,0.1); }

  /* Composer codeweb xếp thành 2 tầng như Claude: input ở trên, các nút
     hiện có ở dưới. Không thêm/bỏ control hay đổi event của chúng. */
  body.codeweb-mode #inputBar {
    display:grid; grid-template-columns:42px 42px minmax(0,1fr) 42px;
    grid-template-rows:auto 42px; gap:7px 8px;
    margin:8px 10px 9px; padding:9px 10px calc(9px + env(safe-area-inset-bottom, 0px));
    background:rgba(255,254,251,0.9); border:1px solid var(--border-soft);
    border-radius:24px; box-shadow:0 10px 28px rgba(61,56,46,0.12);
  }
  body.codeweb-mode #inputField {
    grid-column:1 / -1; grid-row:1; width:100%; height:40px;
    padding:7px 9px; border:0; border-radius:12px; background:transparent;
    box-shadow:none; font-size:14.5px;
  }
  body.codeweb-mode #inputField:focus { border:0; box-shadow:none; }
  body.codeweb-mode #ctrlBtn { grid-column:1; grid-row:2; }
  body.codeweb-mode #imgBtn  { grid-column:2; grid-row:2; }
  body.codeweb-mode #sendBtn { grid-column:4; grid-row:2; }
  body.codeweb-mode #ctrlBtn,
  body.codeweb-mode #imgBtn,
  body.codeweb-mode #sendBtn { width:42px; height:42px; }
  body.codeweb-mode #imgPreviewBar {
    margin:0 10px; padding:7px 10px; border:1px solid var(--border-soft);
    border-bottom:0; border-radius:14px 14px 0 0; background:rgba(255,254,251,0.9);
  }
  @media (max-width:520px) {
    #bar { padding:10px 12px; }
    body.codeweb-mode #inputBar { margin-left:8px; margin-right:8px; }
  }

  /* ── Gợi ý lệnh slash ─────────────────────────────────────────────── */
  #slashHint {
    position:absolute; left:10px; right:10px; bottom:100%;
    max-height:45vh; overflow-y:auto; background:rgba(255,254,251,0.94); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px); border:1px solid var(--border);
    border-radius:var(--radius-md); margin-bottom:8px; display:none;
    box-shadow:var(--shadow-2);
  }
  #slashHint.show { display:block; }
  .slash-item { display:flex; gap:10px; align-items:baseline; padding:10px 14px;
    font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--border-soft); }
  .slash-item:last-child { border-bottom:none; }
  .slash-item:active, .slash-item.active { background:var(--bg-sunken); }
  .slash-item .cmd { color:var(--accent); font-weight:700; flex:0 0 auto; font-family:"JetBrains Mono",monospace; }
  .slash-item .desc { color:var(--text-dim); flex:1 1 auto; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; }

  /* ── Turn wrapper: log-tool ẩn mặc định, mở bằng nút toggle. Cùng kỹ
     thuật grid-template-rows 0fr -> 1fr cho animation mượt đúng chiều
     cao thật, kèm khung kính đơn sắc bao ngoài khi mở. */
  .turn-logs {
    display:grid; grid-template-rows:0fr; opacity:0; margin-top:0;
    transition:grid-template-rows .3s cubic-bezier(.22,.7,.3,1),
               opacity .24s ease, margin-top .3s cubic-bezier(.22,.7,.3,1);
  }
  .turn-logs > .turn-logs-inner {
    overflow:hidden; display:flex; flex-direction:column; gap:10px;
    min-height:0; min-width:0; transform:translateY(-4px); transition:transform .3s cubic-bezier(.22,.7,.3,1);
  }
  .turn-logs.open {
    grid-template-rows:1fr; opacity:1; margin-top:2px;
  }
  .turn-logs.open > .turn-logs-inner { transform:translateY(0); }

  .turn-logs-inner {
    padding:10px; border-radius:var(--radius-lg);
    background:rgba(255,254,251,0.45); backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    border:1px solid var(--border-soft);
  }

  .turn-toggle-row { display:flex; justify-content:flex-start; margin:0 4px; }
  .turn-toggle {
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,254,251,0.55); backdrop-filter:blur(16px) saturate(1.3);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid var(--border-soft); border-radius:999px;
    padding:5px 12px 5px 10px; font-size:12px; font-weight:600; color:var(--text-dim);
    cursor:pointer; overflow:hidden; position:relative;
    box-shadow:
      0 1px 1px rgba(255,255,255,0.6) inset,
      0 2px 6px rgba(61,56,46,0.07);
    transition:transform .15s cubic-bezier(.3,1.3,.5,1), box-shadow .22s cubic-bezier(.22,.7,.3,1), color .12s, background .18s;
  }
  .turn-toggle:active { transform:scale(0.97) translateY(1px); }
  .turn-toggle:hover { color:var(--text); box-shadow:
      0 1px 1px rgba(255,255,255,0.7) inset,
      0 4px 12px rgba(61,56,46,0.1); }
  .turn-toggle.open {
    color:var(--text); background:rgba(255,254,251,0.8);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.7) inset,
      0 -1px 3px rgba(61,56,46,0.05) inset,
      0 4px 12px rgba(61,56,46,0.1);
  }
  .turn-toggle .chev { font-size:10px; transition:transform .26s cubic-bezier(.22,.7,.3,1); display:inline-block; }
  .turn-toggle.open .chev { transform:rotate(90deg); }
  .turn-toggle .tool-count {
    background:var(--bg-sunken); color:var(--text); border-radius:999px;
    padding:1px 7px; font-size:11px; font-weight:700; transition:background .18s;
  }
  .turn-toggle.open .tool-count { background:rgba(176,138,78,0.16); }

  /* ── Live preview: log-tool ĐANG CHẠY hiện dạng popup nổi cố định ở góc
     trái dưới màn hình (không nằm trong luồng #log, không cuộn theo chat).
     Animate "kéo ra" (trượt vào từ trái + phóng to nhẹ) khi xuất hiện,
     "thụt vào" (trượt về trái + thu nhỏ) khi bị thay bởi log mới hoặc khi
     turn kết thúc. */
  .live-slot {
    position:fixed; left:12px; top:calc(var(--bar-h, 44px) + 10px); z-index:40;
    width:min(84vw, 340px);
    transform-origin:left top;
    opacity:0; transform:translateX(-16px) scale(.94);
    transition:transform .32s cubic-bezier(.22,.7,.3,1), opacity .24s ease;
    pointer-events:none;
    will-change: transform, opacity;
  }
  .live-slot > div {
    overflow:hidden;
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-2);
  }
  .live-slot > div > * {
    /* Nội dung clone (tool-group/info-card) vốn thiết kế để nằm full-width
       trong dòng chat -- ép margin về 0 và width 100% trong khung popup hẹp,
       tránh margin âm/dương của .row (margin:0 4px) làm lệch kích thước
       khiến flex bên trong (.tool-group-head) bị tính sai và vỡ dòng ký tự. */
    margin:0 !important;
    width:100%;
    max-width:100%;
    /* Bản clone vốn có animation:rowIn riêng (fade+translateY) -- nếu giữ
       nguyên, nó chạy ĐỒNG THỜI với transition trượt-vào (translateX+scale)
       của .live-slot cha, 2 chuyển động chồng lên nhau ở 2 trục khác nhau
       tạo cảm giác "nảy"/giật thay vì 1 chuyển động mượt duy nhất. Tắt hẳn
       animation trên clone -- popup cha đã tự lo phần "xuất hiện" rồi. */
    animation: none !important;
  }
  .live-slot.entering {
    opacity:1; transform:translateX(0) scale(1);
  }
  .live-slot.collapsing {
    opacity:0; transform:translateX(-16px) scale(.94);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar" class="glass">
    <div id="status"><span id="dot"></span><span id="statusText">Connecting…</span></div>
    <div id="meta"></div>
  </div>
  <div id="mainSplit">
    <div id="logScroll"><div id="log"></div></div>
    <div id="codewebResizer" title="Kéo để đổi tỉ lệ 2 cột"><div id="codewebResizerGrip"></div></div>
    <div id="codewebPane">
      <div id="codewebToolbar">
        <div id="codewebTabs"></div>
        <div id="codewebToolbarBtns">
          <button id="codewebReloadBtn" title="Tải lại preview hiện tại (nếu bị đơ/treo)">⟳</button>
          <button id="codewebSettingsBtn" title="Cài đặt khung xem">⚙</button>
        </div>
      </div>
      <div id="codewebSettingsPanel">
        <div class="cw-settings-title">Khung xem (tỉ lệ)</div>
        <div id="codewebRatioOptions">
          <button data-ratio="none">Tự do</button>
          <button data-ratio="16:9">16:9</button>
          <button data-ratio="9:16">9:16</button>
          <button data-ratio="4:3">4:3</button>
          <button data-ratio="1:1">1:1</button>
          <button data-ratio="20:9">20:9</button>
        </div>
      </div>
      <div id="codewebFrameWrap">
        <iframe id="codewebFrame" sandbox="allow-scripts allow-same-origin" title="live preview"></iframe>
      </div>
      <div id="codewebEmpty">Chưa có preview nào — đợi AI viết file HTML đầu tiên…</div>
    </div>
  </div>
  <!-- iframe ẩn dùng để CHẠY THỬ trước khi swap sang #codewebFrame — xem
       codewebSandboxCheck()/codewebRunAutoPreview(). Không hiển thị, không nằm trong luồng layout. -->
  <iframe id="codewebSandboxFrame" sandbox="allow-scripts allow-same-origin"
          style="position:fixed; left:-9999px; top:-9999px; width:1280px; height:800px; border:0;"
          aria-hidden="true"></iframe>
  <div id="imgPreviewBar"></div>
  <div id="inputBar">
    <div id="slashHint"></div>
    <button id="ctrlBtn" title="Ngắt (Ctrl-C)">^C</button>
    <input id="imgInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple />
    <button id="imgBtn" title="Đính kèm ảnh" aria-label="Đính kèm ảnh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
      </svg>
    </button>
    <input id="inputField" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="Gõ lệnh hoặc tin nhắn rồi Enter…" />
    <button id="sendBtn" title="Gửi" aria-label="Gửi">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</div>

<div id="visionModal">
  <div id="visionModalCard">
    <h3>Model này không hỗ trợ ảnh</h3>
    <p>Model/provider hiện tại đã từ chối ảnh vừa gửi. Nút đính kèm ảnh đã tạm khoá cho phiên này — bạn vẫn có thể tiếp tục chat bằng văn bản.</p>
    <button id="visionModalOk">Đã hiểu</button>
  </div>
</div>

<script>
// ── Renderer: nhận Event JSON (không phải byte-stream ANSI nữa) ────────────
// Giao thức mới (khớp 12_web.py / 01d_events.py):
//   Server -> client (mọi frame là JSON text, opcode 0x1):
//     {"type": "<EV_TYPE>", "data": {...}, "id": "..."}       — Event thường
//     {"type": "ask", "id": "...", "prompt": "...", "kind": "text|confirm|choice",
//      "default": ..., "extra": {...}}                         — cần trả lời
//     {"type": "session_init", "data": {"sid","model","agent","messages"}}
//   Client -> server (JSON text):
//     {"type": "input", "value": "..."}      — 1 dòng lệnh/tin nhắn
//     {"type": "interrupt"}                  — nút ^C ảo
//     {"type": "answer", "id": "...", "value": "..."} — trả lời 1 "ask"

const logEl = document.getElementById("log");
const scrollEl = document.getElementById("logScroll");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const metaEl = document.getElementById("meta");
const inputField = document.getElementById("inputField");
const sendBtn = document.getElementById("sendBtn");
const ctrlBtn = document.getElementById("ctrlBtn");
const imgBtn = document.getElementById("imgBtn");
const imgInput = document.getElementById("imgInput");
const imgPreviewBar = document.getElementById("imgPreviewBar");
const visionModal = document.getElementById("visionModal");
const visionModalOk = document.getElementById("visionModalOk");

// ── Ảnh đính kèm (chỉ /web — xem 12_web.py, đây là cổng vào DUY NHẤT của
// ảnh trong toàn hệ thống). Mảng {mime, data(base64 không prefix), name}.

// trong turn hiện tại", refresh trang là mất, đúng ý muốn.
let pendingImages = [];
// true khi model/provider hiện tại đã bị xác nhận (bởi 1 lỗi thật từ
// server) là không hỗ trợ ảnh -- xám nút, chặn chọn thêm. Reset về false

let visionBlocked = false;
